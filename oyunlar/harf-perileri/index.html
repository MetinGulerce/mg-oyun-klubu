<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Harf Perileri</title>
<meta name="theme-color" content="#fff6fb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MG Oyun">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="apple-touch-icon" href="../../ikonlar/ikon-180.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧚</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@400;500;600;700&family=Titan+One&display=swap">
<style>
:root{
  --harf:"Andika","Fredoka",sans-serif; --bg:#fbe4f0; --panel:#fff6fb; --panel2:#ffe1ef; --line:#f6bcd9;
  --text:#4a2545; --muted:#a3748f; --accent:#ff5fa2; --ok:#3fbf86;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font:15px/1.4 "Fredoka","Segoe UI",system-ui,sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}

header{display:flex;align-items:center;gap:8px 10px;padding:calc(8px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 8px calc(12px + env(safe-area-inset-left));background:linear-gradient(180deg,#fffaf4,#fff0f6);border-bottom:2px solid #f6cfe0;box-shadow:0 2px 8px rgba(160,60,110,.08)}
.brand{font-weight:800;font-size:18px;white-space:nowrap}
.brand span{color:var(--accent)}
#steps{display:flex;gap:2px;align-items:center;padding:3px 8px;border-radius:999px;background:var(--panel2);border:1.5px solid var(--line)}
#steps:empty{display:none}
.hb[hidden]{display:none}
.sd{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px;opacity:.4;position:relative}
.sd img{width:24px;height:24px;border-radius:50%}
.sd.done{opacity:1}
.sd.cur{opacity:1;background:#fff;box-shadow:0 0 0 3px var(--accent)}
.sd.done:not(.cur)::after{content:"✓";position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;border-radius:50%;background:var(--ok);color:#fff;font-size:9px;line-height:14px;text-align:center}
.spacer{flex:1}
/* UI kit: pembe yuvarlak düğmeler, krem halka */
.hb{height:42px;min-width:42px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-weight:700;white-space:nowrap;color:#fff;
  background:linear-gradient(180deg,#ffa3cb,#ff5fa2);border:3px solid #fff7ee;box-shadow:0 0 0 1.5px #f1c9a8,0 3px 0 1.5px #d65b8f}
.hb:active{transform:translateY(2px);box-shadow:0 0 0 1.5px #f1c9a8,0 1px 0 1.5px #d65b8f}
#bookBtn{background:linear-gradient(180deg,#ffe89a,#f6c445);color:#7a4a00;box-shadow:0 0 0 1.5px #f1c9a8,0 3px 0 1.5px #c99a2a}
#bookBtn.bump{animation:bump .5s}
#radioBtn{background:linear-gradient(180deg,#d9c4ff,#a77bf0);box-shadow:0 0 0 1.5px #f1c9a8,0 3px 0 1.5px #7f55c4}
#radioBtn.on{background:linear-gradient(90deg,#ff7eb6,#b26bff);color:#fff}
#menuBtn{font-size:18px}

#stage{position:relative;min-height:0;min-width:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
/* sahne resimleri (ortak/resim/sahne): iki katman, yumuşak geçiş */
#bg{position:absolute;inset:0;overflow:hidden;background:#fbe4f0}
#bg i{position:absolute;inset:-14px;background:center/cover no-repeat;opacity:0;transition:opacity .7s ease}
#bg i.on{opacity:1}
#bg i.yumusak{filter:blur(2px) saturate(1.08)}
#bg::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,246,251,.30),rgba(255,246,251,.12) 45%,rgba(255,240,248,.38))}
#bg.soluk::after{background:linear-gradient(180deg,rgba(255,246,251,.45),rgba(255,246,251,.32) 45%,rgba(255,240,248,.5))}
#scene{position:absolute;inset:0;z-index:1}
#say{position:absolute;left:0;right:0;margin:0 auto;width:fit-content;top:10px;max-width:min(620px,calc(100% - 24px));padding:9px 16px;border-radius:16px;background:rgba(255,255,255,.95);box-shadow:0 3px 12px rgba(160,60,120,.18);font-size:16px;font-weight:600;text-align:center;cursor:pointer;z-index:4}
#say:empty{display:none}
#say .spk{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--panel2);margin-right:6px;vertical-align:middle;font-size:14px}
#milaAv{position:absolute;left:10px;bottom:10px;width:clamp(50px,11vmin,76px);aspect-ratio:1;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 12px rgba(120,40,90,.25);z-index:3;pointer-events:none;transition:transform .2s}
#milaAv[hidden]{display:none}
#milaAv.talk{animation:talk .3s ease-in-out infinite alternate}
#toast{position:absolute;left:50%;bottom:14px;transform:translate(-50%,20px);padding:9px 16px;border-radius:12px;background:#fff;border:1.5px solid var(--accent);opacity:0;transition:.2s;pointer-events:none;width:max-content;max-width:calc(100% - 24px);text-align:center;z-index:7}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* klavye */
footer{display:flex;align-items:center;gap:8px;padding:8px calc(10px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));background:var(--panel);border-top:1px solid var(--line)}
footer[hidden]{display:none}
#kb{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.krow{display:flex;gap:5px;justify-content:center}
.krow:nth-child(2){padding-left:3%}
.krow:nth-child(3){padding-left:8%;padding-right:2%}
.key{flex:1 1 0;min-width:0;max-width:62px;height:48px;border-radius:12px;background:#fff;border:2px solid #f3d3e3;font:700 22px/1 var(--harf);color:#cdb3c3;box-shadow:0 4px 0 #efcfe0;transition:transform .08s,box-shadow .08s;touch-action:manipulation;padding:0}
.key.known{color:#fff;background:hsl(var(--h) 80% 66%);border-color:hsl(var(--h) 60% 52%);box-shadow:0 4px 0 hsl(var(--h) 55% 44%);text-shadow:0 1px 0 hsl(var(--h) 60% 40%)}
.key.press{transform:translateY(3px);box-shadow:0 1px 0 #efcfe0}
.key.known.press{box-shadow:0 1px 0 hsl(var(--h) 55% 44%)}
.key.glow{animation:keyGlow .9s ease-in-out infinite;position:relative;z-index:2}
.key.wig{animation:wig .4s}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tiles .key{flex:none;width:64px;max-width:none;height:60px;font-size:32px;border-radius:16px}
.tiles.many .key{width:44px;height:46px;font-size:22px;border-radius:12px}
#kbMode{flex:none;width:42px;height:42px;border-radius:12px;background:var(--panel2);border:1.5px solid var(--line);font-size:20px}

/* periler: kanatlı yuvarlak harfler */
.peri{position:relative;width:var(--s,96px);height:var(--s,96px);flex:none;cursor:pointer;touch-action:manipulation;animation:float 2.8s ease-in-out infinite;animation-delay:var(--d,0s)}
.peri .bd{position:absolute;inset:5% 11% 21%;border-radius:50%;display:grid;place-items:center;z-index:1;
  background:radial-gradient(circle at 35% 28%,hsl(var(--h) 100% 90%),hsl(var(--h) 88% 70%) 52%,hsl(var(--h) 70% 54%));
  box-shadow:0 calc(var(--s,96px)*.06) 0 hsl(var(--h) 55% 45% / .6),0 10px 22px rgba(120,40,90,.22);transition:box-shadow .2s,transform .2s}
.peri b{font:700 calc(var(--s,96px)*.5)/1 var(--harf);color:#fff;-webkit-text-stroke:calc(var(--s,96px)*.022) hsl(var(--h) 60% 38%);paint-order:stroke fill;text-shadow:0 calc(var(--s,96px)*.03) 0 hsl(var(--h) 60% 38% / .45);pointer-events:none;margin-top:calc(var(--s,96px)*.02)}
.peri .w{position:absolute;top:5%;width:48%;height:52%;border-radius:70% 30% 70% 30%;background:radial-gradient(ellipse at 30% 72%,rgba(255,255,255,.97),hsl(var(--h) 92% 88% / .85) 55%,hsl(var(--h) 80% 76% / .7));border:2px solid #fff;box-shadow:0 0 14px rgba(255,255,255,.9),inset 0 0 10px hsl(var(--h) 90% 85%);z-index:0}
.peri .w::after{content:"";position:absolute;inset:18% 22%;border-radius:inherit;border:1.5px solid rgba(255,255,255,.85);opacity:.75}
.peri .wl{left:-32%;transform-origin:100% 70%;animation:flapL .32s ease-in-out infinite alternate}
.peri .wr{right:-32%;border-radius:30% 70% 30% 70%;transform-origin:0 70%;animation:flapR .32s ease-in-out infinite alternate}
.peri .w2{position:absolute;top:50%;width:34%;height:32%;border-radius:30% 70% 70% 30%;background:radial-gradient(ellipse at 40% 40%,rgba(255,255,255,.95),hsl(var(--h) 90% 86% / .8) 60%,hsl(var(--h) 80% 76% / .65));border:2px solid #fff;box-shadow:0 0 10px rgba(255,255,255,.8);z-index:0}
.peri .wl2{left:-16%;transform-origin:100% 20%;animation:flapL .32s ease-in-out infinite alternate}
.peri .wr2{right:-16%;border-radius:70% 30% 30% 70%;transform-origin:0 20%;animation:flapR .32s ease-in-out infinite alternate}
.peri .sk{position:absolute;left:16%;right:16%;bottom:0;height:30%;clip-path:polygon(26% 0,74% 0,100% 100%,0 100%);z-index:0;
  background:radial-gradient(circle at 15% 100%,#fff 0 11%,transparent 12%),radial-gradient(circle at 38% 100%,#fff 0 11%,transparent 12%),radial-gradient(circle at 62% 100%,#fff 0 11%,transparent 12%),radial-gradient(circle at 85% 100%,#fff 0 11%,transparent 12%),linear-gradient(180deg,hsl(var(--h) 78% 64%),hsl(var(--h) 88% 80%))}
.peri .tj{position:absolute;left:50%;top:-4%;width:34%;height:15%;transform:translateX(-50%);z-index:2;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(120,60,0,.35));
  background:linear-gradient(#ffe98a,#f6c445);clip-path:polygon(0 100%,0 30%,25% 62%,50% 0,75% 62%,100% 30%,100% 100%)}
.peri .tj::after{content:"";position:absolute;left:50%;top:48%;width:26%;height:38%;border-radius:50%;transform:translateX(-50%);background:radial-gradient(circle at 35% 35%,#fff,#ff6fb5)}
.peri .wand{position:absolute;right:-7%;top:30%;width:5%;height:34%;border-radius:3px;background:linear-gradient(#fff,#ffd0e4);transform:rotate(24deg);z-index:2;box-shadow:0 0 4px rgba(255,255,255,.9);pointer-events:none}
.peri .wand::after{content:"★";position:absolute;left:50%;top:-34%;transform:translateX(-50%);font-size:calc(var(--s,96px)*.2);line-height:1;color:#ffd84a;text-shadow:0 0 6px #fff,0 0 10px #ffe98a}
.peri::after{content:"✧";position:absolute;left:-16%;bottom:14%;font-size:calc(var(--s,96px)*.2);line-height:1;color:#fff;text-shadow:0 0 6px #ffe98a,0 0 10px #fff;z-index:2;pointer-events:none;animation:dust 1.7s ease-in-out infinite}
.peri::before{content:"✦";position:absolute;right:-14%;top:-6%;font-size:calc(var(--s,96px)*.16);line-height:1;color:#ffd84a;text-shadow:0 0 6px #fff;z-index:2;pointer-events:none;animation:dust 1.7s ease-in-out .85s infinite}
.peri.calm .w2,.stop .peri .w2,.book .peri .w2{animation:none}
.peri .lc{position:absolute;right:-10%;bottom:-8%;width:40%;height:40%;border-radius:50%;background:#fff;display:grid;place-items:center;z-index:2;font:700 calc(var(--s,96px)*.27)/1 var(--harf);color:hsl(var(--h) 60% 45%);box-shadow:0 3px 8px rgba(120,40,90,.22)}
.peri.sing .bd{transform:scale(1.14);box-shadow:0 0 0 calc(var(--s,96px)*.06) #fff,0 0 34px 14px hsl(var(--h) 100% 78%)}
.peri.glow .bd{animation:periGlow 1s ease-in-out infinite}
.peri.wig{animation:wig .45s}
.peri.hide{opacity:0;transform:translateY(45%) scale(.3);transition:none}
.peri.show{transition:opacity .35s,transform .45s cubic-bezier(.2,1.6,.4,1)}
.peri.tapped .bd{animation:pop .35s}
.peri.calm{animation:none}
.peri.calm .w{animation:none}

/* tanışma */
.tanisWrap{display:flex;align-items:center;justify-content:center;gap:clamp(24px,7vw,80px);flex-wrap:wrap;height:100%;padding:64px 16px 64px}
.tanisWrap .peri{--s:clamp(120px,min(34vw,36vh),230px)}
.pcard{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border-radius:26px;padding:14px 22px;box-shadow:0 8px 0 var(--line),0 12px 30px rgba(120,40,90,.15);cursor:pointer}
.pe{font-size:clamp(56px,13vmin,112px);line-height:1.05;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.pimg{width:clamp(70px,17vmin,130px);aspect-ratio:1;border-radius:50%;border:4px solid #ffd0e4;display:block}
.pw{font:700 clamp(26px,6.5vmin,46px)/1 var(--harf);letter-spacing:.08em;color:var(--text)}
.pw .f{color:var(--accent)}
.stars3{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:34px;display:flex;gap:6px}
.stars3 i{font-style:normal;filter:grayscale(1);opacity:.3}
.stars3 i.on{filter:none;opacity:1;animation:pop .45s}

/* ses avı */
.tur{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:2}
.tur i{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--line)}
.tur i.on{background:var(--accent);border-color:var(--accent)}
.cicekler{position:absolute;left:0;right:0;bottom:4%;top:96px;display:flex;justify-content:space-evenly;align-items:flex-end;padding:0 3%}
.spot{display:flex;flex-direction:column;align-items:center}
.spot .peri{--s:clamp(78px,min(25vw,30vh),156px)}
.flower{font-size:clamp(46px,min(15vw,17vh),92px);line-height:1;margin-top:-8px;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;filter:drop-shadow(0 4px 4px rgba(90,30,70,.18))}

/* kaydırak */
#ksvg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.kay{touch-action:none}
.kp{position:absolute;--s:clamp(66px,min(18vw,23vh),124px);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2)}
.token{position:absolute;--t:clamp(54px,min(14vw,17vh),84px);width:var(--t);height:var(--t);margin:calc(var(--t)/-2) 0 0 calc(var(--t)/-2);border-radius:50%;border:4px solid #fff;box-shadow:0 6px 14px rgba(120,40,90,.3);z-index:3;pointer-events:none}
.token img{width:100%;height:100%;border-radius:50%;display:block}
.heceBig{position:absolute;left:50%;top:16%;transform:translateX(-50%);display:flex;gap:.04em;font:700 clamp(64px,17vmin,140px)/1 var(--harf);z-index:4;pointer-events:none;animation:popIn .5s cubic-bezier(.2,1.6,.4,1)}
.heceBig[hidden]{display:none}
.heceBig span{color:hsl(var(--h) 75% 60%);-webkit-text-stroke:.05em #fff;paint-order:stroke fill;text-shadow:0 .05em 0 hsl(var(--h) 60% 40%),0 .1em .1em rgba(80,20,60,.3)}
.hand{position:absolute;font-size:46px;margin:-6px 0 0 -14px;z-index:5;pointer-events:none;animation:hand 1s ease-in-out infinite;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.hand[hidden]{display:none}

/* kelime */
.kwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,3vh,26px);height:100%;padding:60px 12px 12px}
.kpic{cursor:pointer;line-height:1;filter:drop-shadow(0 8px 8px rgba(90,30,70,.18))}
.kpic .pe{font-size:clamp(76px,22vmin,160px)}
.kpic .pimg{width:clamp(100px,26vmin,190px);border-width:6px}
.kpic.yay{animation:yay .8s cubic-bezier(.2,1.6,.4,1)}
.slots{display:flex;gap:clamp(6px,1.6vw,12px)}
.slot{--h:330;width:clamp(54px,12.5vmin,88px);height:clamp(62px,14.5vmin,98px);border-radius:18px;border:3px dashed var(--line);background:rgba(255,255,255,.75);display:grid;place-items:center;font:700 clamp(38px,9.5vmin,66px)/1 var(--harf);transition:transform .2s,background .2s}
.slot.cur{border-color:var(--accent);border-style:solid;background:#fff;animation:pulse 1.2s ease-in-out infinite}
.slot .lt{color:hsl(var(--h) 72% 58%);-webkit-text-stroke:.03em hsl(var(--h) 60% 40%);animation:popIn .4s cubic-bezier(.2,1.6,.4,1)}
.slot .gh{color:#ead3df}
.slot.read{background:hsl(var(--h) 95% 90%);border-color:hsl(var(--h) 70% 60%);transform:scale(1.15) translateY(-6px)}

/* harita */
.mapScroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:58px 0 76px;-webkit-overflow-scrolling:touch}
.mapInner{position:relative;margin:0 auto}
.mpath{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.stop{position:absolute;--n:84px;width:var(--n);height:var(--n);margin:calc(var(--n)/-2) 0 0 calc(var(--n)/-2);border-radius:50%;background:#fff;border:4px solid var(--line);display:grid;place-items:center;box-shadow:0 6px 0 var(--line);padding:0}
.stop .peri{--s:calc(var(--n)*.62);animation:none}
.stop .peri .w{animation:none}
.stop .pe{font-size:calc(var(--n)*.5)}
.stop .pimg{width:calc(var(--n)*.7);border-width:2px}
.stop.done{border-color:#8fe3a1;box-shadow:0 6px 0 #8fe3a1}
.stop.done::after{content:"✓";position:absolute;right:-4px;top:-4px;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;font-weight:800;font-size:14px;line-height:24px;text-align:center}
.stop.kay::before{content:"🌈";position:absolute;left:-6px;bottom:-6px;font-size:calc(var(--n)*.3);font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.stop.cur{border-color:var(--accent);box-shadow:0 6px 0 #f39ac3;animation:pulse 1.3s ease-in-out infinite}
.stop.lock{filter:grayscale(.85);opacity:.45}
.mapMila{position:absolute;width:var(--m,56px);aspect-ratio:1;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 12px rgba(120,40,90,.3);margin-left:calc(var(--m,56px)/-2);pointer-events:none;animation:bob 1.6s ease-in-out infinite;z-index:2}
.mapEnd{position:absolute;font-size:44px;margin:-26px 0 0 -26px;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.mapBar{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:10px;z-index:3;padding:0 10px}
.mapBar button{padding:10px 18px;border-radius:999px;background:linear-gradient(180deg,#ffa3cb,#ff5fa2);color:#fff;border:3px solid #fff7ee;font-weight:700;font-size:16px;box-shadow:0 0 0 1.5px #f1c9a8,0 4px 0 1.5px #d65b8f;white-space:nowrap;text-shadow:0 1px 0 rgba(160,30,80,.35)}
.mapBar button:first-child{background:linear-gradient(180deg,#ffe89a,#f6c445);color:#7a4a00;text-shadow:none;box-shadow:0 0 0 1.5px #f1c9a8,0 4px 0 1.5px #c99a2a}

/* serbest klavye */
.free{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;height:100%;padding:60px 12px 12px}
.yazi{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;min-height:70px;max-width:100%;padding:8px 14px;border-radius:20px;background:rgba(255,255,255,.8);border:3px dashed var(--line)}
.yazi span{font:700 clamp(36px,8vmin,60px)/1 var(--harf);color:hsl(var(--h) 72% 58%);-webkit-text-stroke:.03em hsl(var(--h) 60% 40%);animation:popIn .3s}
.yazi .bos{color:#e6c9d8;-webkit-text-stroke:0;font-weight:500;animation:none}
.freeBig{min-height:clamp(90px,24vmin,170px);display:flex;align-items:center;justify-content:center;gap:18px}
.freeBig .peri{--s:clamp(90px,24vmin,170px)}
.fbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.fbtns button{padding:10px 16px;border-radius:14px;background:#fff;border:2px solid var(--line);font-weight:700;font-size:17px;box-shadow:0 4px 0 var(--line)}

/* başlık ekranı */
#title{position:absolute;inset:0;z-index:9;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,246,251,.2),rgba(255,240,248,.55) 70%,rgba(255,236,246,.8)),url(../../ortak/resim/sahne/kale-gol.webp) center/cover #fbe4f0}
#title .txt{background:rgba(255,250,253,.82);border:3px solid #fff7ee;box-shadow:0 0 0 1.5px #f1c9a8,0 10px 30px rgba(120,40,90,.18);border-radius:28px;padding:10px 22px 16px}
#title[hidden]{display:none}
.tcard{position:relative;z-index:1;text-align:center;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.frame{width:min(64vw,42vh,300px);aspect-ratio:4/5;border-radius:32px;border:10px solid #f6c445;box-shadow:0 0 0 5px #fff,0 0 0 9px #ffd0e4,0 18px 40px rgba(120,40,90,.3);overflow:hidden;background:#ffe3f0;animation:frameIn .9s cubic-bezier(.2,1.5,.4,1) both}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.tcard h1{margin:6px 0 0;font:400 clamp(36px,8vw,62px)/1.05 "Titan One","Fredoka",sans-serif}
.tcard h1 span:nth-child(1){color:#ff5fa2} .tcard h1 span:nth-child(2){color:#b26bff}
.tcard .by{margin:0;font-size:clamp(16px,3.6vw,20px);font-weight:600;color:#c2437f}
.tcard .txt{text-align:center}
.tbtn{margin-top:6px;display:inline-flex;align-items:center;gap:10px;height:64px;padding:0 34px;border-radius:24px;font-size:26px;font-weight:800;background:linear-gradient(180deg,#ff86ba,#ff4f9a);color:#fff;box-shadow:0 6px 0 #d63a80;animation:bob 1.8s ease-in-out infinite}
.tbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #d63a80}
.tfly{position:absolute;pointer-events:none;opacity:.85}
.tfly .peri{animation-duration:3.4s}

/* pencereler */
#modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(74,37,69,.38);z-index:8;padding:16px}
#modal[hidden]{display:none}
.card{max-height:100%;overflow:auto;width:min(480px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 24px;--cpb:22px;box-shadow:0 20px 60px rgba(120,40,90,.35)}
.card.wide{width:min(760px,100%)}
.card h2{margin:0 0 8px;font-size:22px}
.card h3{margin:16px 0 6px;font-size:17px}
.card p{margin:6px 0;color:#6b4263}
.card .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;position:sticky;bottom:calc(-1 * var(--cpb));margin-bottom:calc(-1 * var(--cpb));padding:10px 0 var(--cpb);background:linear-gradient(rgba(255,246,251,0),var(--panel) 38%)}
.card .row button{padding:10px 16px;border-radius:12px;background:var(--panel2);font-weight:700}
.card .row button.primary{background:var(--accent);color:#fff}
.story{text-align:center}
.story img{width:min(150px,36vw);aspect-ratio:4/5;object-fit:cover;border-radius:20px;border:6px solid #f6c445;box-shadow:0 0 0 3px #fff,0 8px 20px rgba(120,40,90,.25)}
.story p{font-size:15.5px;line-height:1.55}
.final{text-align:center}
.final .peri{--s:110px;margin:16px auto 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.chips span{font-family:var(--harf);display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:#fff;border:2px solid var(--line);font-weight:700;font-size:17px;letter-spacing:.05em}
.chips .pe{font-size:24px}
.chips .pimg{width:28px;border-width:2px}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;margin-top:8px;border-radius:12px;background:var(--panel2);border:2px solid transparent;font-weight:600;text-align:left}
.mi:hover{border-color:var(--accent)}
.mi .e{font-size:20px}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px;margin-top:8px}
.book div{background:#fff;border-radius:16px;padding:10px 6px;text-align:center;border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px}
.book .peri{--s:52px;animation:none}
.book .peri .w{animation:none}
.book .pe{font-size:30px}
.book .pimg{width:34px;border-width:2px}
.book small{font-weight:700;letter-spacing:.06em}
.book .yok{opacity:.4}
.book .yok b{font:700 30px/52px var(--harf);color:#d9b5c8}
.lt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.lt-grid div{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-size:14px}
.lt-grid b{font-family:var(--harf);font-size:22px;width:30px;text-align:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 12px;border-radius:12px;background:#fff;border:2px solid var(--line);font-weight:600}
.seg button.on{border-color:var(--accent);background:#ffd0e4}
.tips{margin:6px 0 0;padding-left:20px;color:#6b4263}
.tips li{margin:4px 0}

#celebrate{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:6;overflow:hidden;animation:milaOut .6s ease-in 3s forwards}
#celebrate[hidden]{display:none}
#celebrate::before{content:"";position:absolute;left:50%;top:50%;width:160vmax;height:160vmax;margin:-80vmax 0 0 -80vmax;
  background:repeating-conic-gradient(rgba(255,226,120,.55) 0 9deg,rgba(255,226,120,0) 9deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 42%);mask:radial-gradient(circle,#000 0,transparent 42%);animation:milaSpin 9s linear infinite}
#celebrate .stack{position:relative;display:flex;flex-direction:column;align-items:center}
#celebrate .word{display:flex;font:700 clamp(80px,19vw,240px)/1.05 var(--harf);letter-spacing:.03em}
#celebrate .word span{display:inline-block;color:var(--c);-webkit-text-stroke:.06em #fff;paint-order:stroke fill;
  text-shadow:0 .03em 0 var(--d),0 .06em 0 var(--d),0 .09em 0 var(--d),0 .12em 0 var(--d),0 .17em .08em rgba(80,20,60,.45);
  animation:milaIn .9s cubic-bezier(.2,1.6,.4,1) both,milaWob 1.1s ease-in-out infinite;animation-delay:calc(var(--i)*.13s),calc(.9s + var(--i)*.13s)}
#celebrate .sub{font:700 clamp(18px,3.4vw,38px)/1 "Fredoka",sans-serif;color:#fff;background:linear-gradient(90deg,#ff5fa2,#b26bff);padding:.35em 1.1em;border-radius:999px;margin-top:.45em;box-shadow:0 .2em 0 rgba(120,30,90,.35);animation:milaIn .7s cubic-bezier(.2,1.6,.4,1) .8s both}

/* ara bölümler: kısa, eğlenceli molalar */
.stop.ara{background:linear-gradient(160deg,#fff7fc,#ffe1f0);border-color:#ffc0dd;box-shadow:0 6px 0 #ffc0dd}
.stop.ara .pe{font-size:calc(var(--n)*.56)}
.stop.ara::before{content:"✨";position:absolute;right:-6px;bottom:-6px;font-size:calc(var(--n)*.28);font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.stop.ara.done{border-color:#8fe3a1;box-shadow:0 6px 0 #8fe3a1}
.araStars{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);display:flex;gap:3px;font-size:clamp(20px,5.5vmin,32px);z-index:3;pointer-events:none;white-space:nowrap}
.araStars i{font-style:normal;filter:grayscale(1);opacity:.3}
.araStars i.on{filter:none;opacity:1;animation:pop .45s}
.emo{font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
/* balon şenliği */
#scene.balon{overflow:hidden}
.bl{position:absolute;left:0;top:0;width:var(--bw);height:calc(var(--bw)*1.2);margin-left:calc(var(--bw)/-2);border-radius:50% 50% 47% 47%/56% 56% 44% 44%;
  background:radial-gradient(circle at 33% 27%,rgba(255,255,255,.9) 0 8%,transparent 9%),radial-gradient(circle at 50% 42%,hsl(var(--h) 95% 80%),hsl(var(--h) 72% 58%));
  box-shadow:inset -7px -10px 16px hsl(var(--h) 70% 42% / .35),0 8px 14px rgba(90,30,70,.18);display:grid;place-items:center;cursor:pointer;touch-action:manipulation}
.bl b{font:700 calc(var(--bw)*.52)/1 var(--harf);color:#fff;-webkit-text-stroke:calc(var(--bw)*.022) hsl(var(--h) 60% 36%);paint-order:stroke fill;pointer-events:none}
.bl::before{content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:9px;margin-left:-6px;background:hsl(var(--h) 72% 58%);clip-path:polygon(50% 0,100% 100%,0 100%)}
.bl::after{content:"";position:absolute;left:50%;top:calc(100% + 2px);width:2px;height:calc(var(--bw)*.85);background:linear-gradient(rgba(140,80,120,.6),rgba(140,80,120,0))}
.bl.glow{box-shadow:inset -7px -10px 16px hsl(var(--h) 70% 42% / .35),0 0 0 5px #ffe98a,0 0 26px 10px #fff3b0}
.bl.patla{animation:blPop .28s ease-out forwards;pointer-events:none}
/* doğum günü pastası */
.pastaWrap{position:absolute;left:50%;bottom:3%;width:var(--cw,300px);margin-left:calc(var(--cw,300px)/-2);display:flex;flex-direction:column;align-items:center;cursor:pointer;touch-action:manipulation}
.pastaWrap.hazir{animation:pulse 1.1s ease-in-out infinite}
.mumlar{display:flex;gap:calc(var(--cw)*.022);align-items:flex-end;padding-top:calc(var(--cw)*.13);margin-bottom:calc(var(--cw)*-.02);position:relative;z-index:2}
.mum{position:relative;width:calc(var(--cw)*.12);height:calc(var(--cw)*.25);border-radius:calc(var(--cw)*.024) calc(var(--cw)*.024) 4px 4px;
  background:repeating-linear-gradient(-35deg,hsl(var(--h) 90% 80%) 0 8px,#fff 8px 14px);box-shadow:inset -4px 0 0 hsl(var(--h) 60% 55% / .3),0 4px 8px rgba(90,30,70,.15);display:grid;place-items:center;cursor:pointer}
.mum b{width:calc(var(--cw)*.105);height:calc(var(--cw)*.105);border-radius:50%;display:grid;place-items:center;background:hsl(var(--h) 75% 60%);box-shadow:0 0 0 2px #fff;
  font:700 calc(var(--cw)*.08)/1 var(--harf);color:#fff;pointer-events:none}
.mum::before{content:"";position:absolute;left:50%;top:calc(var(--cw)*-.035);width:2px;margin-left:-1px;height:calc(var(--cw)*.035);background:#6b4a3a}
.mum .alev{position:absolute;left:50%;bottom:calc(100% + var(--cw)*.03);width:calc(var(--cw)*.065);height:calc(var(--cw)*.095);margin-left:calc(var(--cw)*-.0325);border-radius:50% 50% 50% 50%/62% 62% 38% 38%;
  background:radial-gradient(circle at 50% 72%,#fff 0 16%,#ffe25c 30%,#ff9a2e 68%,rgba(255,120,40,0) 71%);opacity:0;transform:scale(.2);transform-origin:50% 100%;transition:opacity .25s,transform .35s cubic-bezier(.2,1.6,.4,1);pointer-events:none;filter:drop-shadow(0 0 8px #ffd25c)}
.mum.yan .alev{opacity:1;transform:none;animation:alev .45s ease-in-out infinite alternate}
.mum.glow{animation:periGlow 1s ease-in-out infinite}
.mum.wig{animation:wig .45s}
.kat{position:relative;border-radius:calc(var(--cw)*.045) calc(var(--cw)*.045) calc(var(--cw)*.02) calc(var(--cw)*.02)}
.kat.k1{width:74%;height:calc(var(--cw)*.19);background:linear-gradient(#fff6fa 0 24%,#ffb3d1 24%);box-shadow:inset 0 -6px 0 rgba(200,60,120,.14)}
.kat.k2{width:94%;height:calc(var(--cw)*.23);background:linear-gradient(#fff6fa 0 19%,#ff8fbf 19%);box-shadow:inset 0 -6px 0 rgba(200,60,120,.18)}
.kat::after{content:"";position:absolute;inset:34% 5% 16%;background:radial-gradient(circle,#ffe95c 0 3px,transparent 4px) 0 0/30px 22px,radial-gradient(circle,#7cc8ff 0 3px,transparent 4px) 15px 11px/30px 22px;opacity:.9}
.kat .cl{position:absolute;top:-30%;font-size:calc(var(--cw)*.075);line-height:1}
#scene.pasta.yatay .mumlar{padding-top:calc(var(--cw)*.1)}
#scene.pasta.yatay .mum{height:calc(var(--cw)*.17)}
#scene.pasta.yatay .kat.k1{height:calc(var(--cw)*.12)}
#scene.pasta.yatay .kat.k2{height:calc(var(--cw)*.14)}
.tabak{width:104%;height:calc(var(--cw)*.05);border-radius:50%;background:#fff;box-shadow:0 6px 10px rgba(90,30,70,.18)}
/* Pamuk'la dans */
#scene.dans{display:flex;flex-direction:column;align-items:center;overflow:hidden}
.disko{position:absolute;left:50%;top:-70%;width:220%;aspect-ratio:1;margin-left:-110%;background:repeating-conic-gradient(rgba(255,150,210,.24) 0 7deg,transparent 7deg 20deg,rgba(150,200,255,.2) 20deg 27deg,transparent 27deg 40deg);animation:milaSpin 16s linear infinite;pointer-events:none}
.dSahne{position:relative;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;gap:5%;padding-top:40px}
.pamuk{font-size:var(--ps,140px);line-height:1;filter:drop-shadow(0 10px 10px rgba(90,30,70,.25));pointer-events:none}
.pamuk .u{display:inline-block}
.dMila{width:calc(var(--ps,140px)*.58);aspect-ratio:1;border-radius:50%;border:4px solid #fff;box-shadow:0 6px 14px rgba(90,30,70,.25);object-fit:cover}
.idle .u,img.idle{animation:bob 1.2s ease-in-out infinite}
.m0 .u,img.m0{animation:dHop .6s}
.m1 .u,img.m1{animation:dSpin .7s}
.m2 .u,img.m2{animation:dWig .6s}
.m3 .u,img.m3{animation:dFlip .7s}
.pamuk.son .u{animation:dSpin .8s 3}
.dPeri{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;padding:6px 10px 46px}
.dPeri .peri{--s:var(--fs,70px)}
#scene.dans.yatay{flex-direction:row;justify-content:center;padding:46px 12px 44px}
#scene.dans.yatay .dSahne{flex:0 0 auto;width:auto;padding:0 3%}
#scene.dans.yatay .dPeri{flex:0 1 auto;max-width:55%;padding:0}
@keyframes blPop{to{transform:scale(1.6);opacity:0}}
@keyframes alev{from{transform:scale(1) rotate(-4deg)}to{transform:scale(1.07,1.16) rotate(4deg)}}
@keyframes dHop{0%,100%{transform:none}40%{transform:translateY(-30%) scale(1.05,.95)}70%{transform:translateY(0) scale(1.1,.9)}}
@keyframes dSpin{to{transform:rotate(360deg)}}
@keyframes dWig{0%,100%{transform:none}25%{transform:rotate(-16deg) translateX(-10%)}75%{transform:rotate(16deg) translateX(10%)}}
@keyframes dFlip{0%,100%{transform:none}50%{transform:scaleX(-1) translateY(-18%)}}

/* sürpriz balon, uçan peri, çıkartma */
.bl.hediye{background:radial-gradient(circle at 33% 27%,rgba(255,255,255,.9) 0 8%,transparent 9%),repeating-conic-gradient(from 10deg,#ffd84a 0 22deg,#ff8fc8 22deg 44deg,#9fd4ff 44deg 66deg);animation:pulse 1s ease-in-out infinite}
.bl.hediye b{font-size:calc(var(--bw)*.5)}
.ucanPeri{position:absolute;z-index:5;pointer-events:none;transform:translate(-50%,-50%);animation:periUc 2.6s ease-in forwards}
.ucanPeri .peri{--s:84px}
.ucanC{position:fixed;z-index:60;font-size:52px;line-height:1;pointer-events:none;transform:translate(-50%,-50%);transition:left .9s cubic-bezier(.4,0,.6,1),top .9s cubic-bezier(.3,-.3,.7,1),transform .9s;filter:drop-shadow(0 4px 6px rgba(90,30,70,.3))}
.cikartmalar{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.cikartmalar span{position:relative;width:56px;height:56px;border-radius:16px;background:#fff;border:2px solid var(--line);display:grid;place-items:center;font-size:32px;animation:popIn .4s cubic-bezier(.2,1.6,.4,1)}
.cikartmalar span i{position:absolute;right:-7px;bottom:-7px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;font:700 12px/20px sans-serif;text-align:center;font-style:normal;box-shadow:0 0 0 2px #fff}
/* eğlence köşesi */
.eglence{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-top:8px}
.eglence button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:18px;background:#fff;border:2.5px solid var(--line);font-weight:700;font-size:14px;color:#7a3b5f;box-shadow:0 4px 0 var(--line)}
.eglence button .pe{font-size:40px;line-height:1}
.eglence button:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
.mapBar #mFun{background:linear-gradient(180deg,#d9b8ff,#a66bff);box-shadow:0 0 0 1.5px #f1c9a8,0 4px 0 1.5px #7a3dc4}
/* kek yapalım */
.kekWrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:60px 8px 8px}
.kekWrap.yatay{flex-direction:row;justify-content:center;align-items:flex-end;gap:18px;padding:52px 8px 8px}
.kekWrap.yatay .tepsi{max-width:46%;padding:0}
.kaseler{display:flex;gap:4vw;justify-content:center;align-items:center;flex:1;flex-wrap:wrap}
.kase{display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border-radius:26px;padding:12px 16px;box-shadow:0 6px 0 var(--line);cursor:pointer;font-weight:800;color:#7a3b5f;touch-action:manipulation}
.kase .pe{font-size:clamp(44px,12vmin,80px);line-height:1}
.kase.sec{animation:pop .4s}
.kk{position:relative;width:var(--cw,300px);display:flex;flex-direction:column;align-items:center;cursor:pointer;flex:none;touch-action:manipulation}
.kk.hazir{animation:pulse 1.1s ease-in-out infinite}
.kk .kat.k1{background:linear-gradient(#fff6fa 0 24%,var(--kek) 24%)}
.kk .kat.k2{background:linear-gradient(#fff6fa 0 19%,var(--kek2) 19%)}
.kk .kat::after{display:none}
.kk .mumlar[hidden]{display:none}
.sus{position:absolute;font-size:calc(var(--cw)*.11);line-height:1;transform:translate(-50%,-50%);animation:popIn .4s cubic-bezier(.2,1.6,.4,1);pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15));z-index:3}
.tepsi{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;padding:10px 6px 0;max-width:100%}
.tepsi[hidden]{display:none}
.sustus{position:relative;width:clamp(46px,11vmin,64px);height:clamp(46px,11vmin,64px);border-radius:16px;background:#fff;border:3px solid var(--line);display:grid;place-items:center;font-size:clamp(24px,6vmin,34px);line-height:1;cursor:pointer;box-shadow:0 4px 0 var(--line);touch-action:manipulation}
.sustus b,.yem b{position:absolute;right:-7px;top:-7px;width:22px;height:22px;border-radius:50%;background:hsl(var(--h) 75% 58%);color:#fff;font:700 13px/22px var(--harf);text-align:center;box-shadow:0 0 0 2px #fff}
.sustus.press{animation:pop .3s}
.hazirBtn{padding:9px 18px;border-radius:999px;background:linear-gradient(180deg,#ffe89a,#f6c445);border:3px solid #fff;font-weight:800;font-size:16px;color:#7a4a00;box-shadow:0 4px 0 #c99a2a}
/* yapboz */
.ypWrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:12px;padding:96px 6px 12px}
.ypWrap.yatay{flex-direction:row;justify-content:center;align-items:center;gap:26px;padding:62px 8px 10px}
.tahta{position:relative;display:grid;gap:3px;background:rgba(255,255,255,.7);padding:5px;border-radius:14px;box-shadow:0 6px 0 var(--line);transition:box-shadow .4s}
.yuva{position:relative;width:var(--pw);height:var(--ph);border-radius:8px;background:rgba(255,255,255,.55);border:2px dashed #d9a5c4;display:grid;place-items:center;font:700 calc(var(--ph)*.5)/1 var(--harf);color:#d9b5c8;box-sizing:border-box}
.yuva.dolu{border-color:transparent;color:transparent}
.yuva.glow{animation:periGlow 1s ease-in-out infinite}
.yuva.wig{animation:wig .45s}
.tahta.bitti{box-shadow:0 0 0 6px #fff,0 0 40px 10px #ffe98a}
.kutu{position:relative;flex:none}
.parca{position:absolute;left:0;top:0;width:var(--pw);height:var(--ph);border-radius:8px;background-image:var(--img);background-size:var(--bw) var(--bh);background-position:var(--bx) var(--by);box-shadow:0 3px 8px rgba(90,30,70,.3);cursor:grab;touch-action:none;z-index:2;display:grid;place-items:center;transform-origin:0 0;outline:2px solid #fff}
.parca b{font:700 calc(var(--ph)*.5)/1 var(--harf);color:#fff;-webkit-text-stroke:.04em #7a3b5f;paint-order:stroke fill;text-shadow:0 2px 5px rgba(0,0,0,.45);pointer-events:none;transition:opacity .3s}
.parca.sec{box-shadow:0 0 0 4px #ffd84a,0 6px 14px rgba(90,30,70,.35);z-index:5}
.parca.tut{z-index:6;box-shadow:0 12px 24px rgba(90,30,70,.4);transition:none;cursor:grabbing}
.parca.gez{transition:left .35s,top .35s,transform .35s}
.parca.yerde{cursor:default;box-shadow:none;z-index:1;outline:none}
.tahta.bitti ~ .parca b,.parca.yerde.gizli b{opacity:0}

let actx = null;
function AC(){ if (!actx){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } } return actx; }

function tone(f, dur, type = 'sine', vol = 0.1, when = 0, slide = 0){
  if (store.muted) return; const a = AC(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + when;
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.03);
}

// Kısa sesler (harf, hece, kelime) Web Audio ile çalar: tam zamanında başlar, kaydırakta uzatılabilir.
const BUF = {};
function loadBuf(id){
  if (BUF[id] !== undefined) return BUF[id];
  const a = AC(); if (!a) return (BUF[id] = Promise.resolve(null));
  return (BUF[id] = fetch(`ses/${id}.mp3`).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
    .then(b => new Promise((res, rej) => a.decodeAudioData(b, res, rej)))
    .then(b => {   // baştaki ve sondaki sessizliği bul
      const d = b.getChannelData(0), n = d.length, th = 0.02; let s = 0, e = n - 1;
      while (s < n && Math.abs(d[s]) < th) s++; while (e > s && Math.abs(d[e]) < th) e--;
      if (s >= e){ s = 0; e = n - 1; }
      return {b, s0:s / b.sampleRate, s1:e / b.sampleRate};
    }).catch(() => null));
}
let tok = 0; const live = new Set();
function playBuf(B, from, to){
  return new Promise(res => {
    const a = AC(), src = a.createBufferSource(), g = a.createGain(), dur = Math.max(0.06, to - from), t = a.currentTime;
    src.buffer = B.b; src.connect(g); g.connect(a.destination);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(1, t + 0.012); g.gain.setValueAtTime(1, t + Math.max(0.02, dur - 0.05)); g.gain.linearRampToValueAtTime(0, t + dur);
    src.onended = () => { live.delete(src); res(); }; live.add(src); src.start(t, from, dur + 0.02);
  });
}

// "Mmmmm" yerine "mi mi mi" der, çocuğa yanlış ses öğretir.
function silent(text){ return sleep(text ? Math.min(2500, 400 + text.length * 25) : 300); }
async function clip(id, maxDur){
  if (store.muted || !SAY[id]) return;
  const B = await loadBuf(id);
  if (!B) return sleep(250);
  const from = Math.max(0, B.s0 - 0.02), end = Math.min(B.b.duration, B.s1 + 0.06);
  await playBuf(B, from, maxDur ? Math.min(end, B.s0 + maxDur) : end);
}
const harfSes = (L, kisa) => clip('h_' + aid(L), kisa ? 0.55 : 0.85);
// Heceleme için uzatılmış ses: uzayan sesler ~0,75 sn, kısacık sesler (b, k) kendi boyunda.
// Bir sonraki ses, öncekinin sönmesine binerek başlar: "nnn-iii-nnn-eee" kopmadan akar.
async function harfUzat(L){
  if (store.muted) return sleep(450);
  const B = await loadBuf('h_' + aid(L)); if (!B) return sleep(450);
  const pat = PATLAYAN.has(L), from = Math.max(0, B.s0 - 0.02);
  const to = pat ? Math.min(B.b.duration, B.s1 + 0.06) : Math.min(B.s1, B.s0 + 0.75);
  playBuf(B, from, to);
  return sleep(Math.max(0.12, to - from - (pat ? -0.05 : 0.1)) * 1000);
}
function hushClips(){ for (const s of live){ try { s.stop(); } catch (e) {} } live.clear(); }

// Kaydırakta parmak perinin üstündeyken ses uzar (sesliler ve m, n, l gibi uzayan sesler döngüde çalar)
let hold = null;
async function startHold(L){
  stopHold(); if (store.muted) return;
  const h = {L}; hold = h;
  const B = await loadBuf('h_' + aid(L));
  if (hold !== h) return;
  if (!B) return;
  const a = AC(), src = a.createBufferSource(), g = a.createGain(), t = a.currentTime, len = B.s1 - B.s0;
  src.buffer = B.b; src.connect(g); g.connect(a.destination);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(1, t + 0.02);
  if (!PATLAYAN.has(L) && len > 0.3){ src.loop = true; src.loopStart = B.s0 + len * 0.3; src.loopEnd = B.s0 + len * 0.72; }
  src.start(t, Math.max(0, B.s0 - 0.02)); h.src = src; h.g = g; live.add(src); src.onended = () => live.delete(src);
}
function stopHold(){
  if (!hold) return; const h = hold; hold = null;
  if (h.src){ const a = AC(), t = a.currentTime; try { h.g.gain.cancelScheduledValues(t); h.g.gain.setValueAtTime(h.g.gain.value, t); h.g.gain.linearRampToValueAtTime(0, t + 0.08); h.src.stop(t + 0.1); } catch (e) {} }
}

      if (wrong >= 2){ yuvalar[pi].classList.add('glow'); glowKey(harf[pi], true); }
    }
  }
  async function finish(){
    bitti = true; glowKey(null); $('#th').classList.add('bitti'); parcalar.forEach(p => p.classList.add('gizli')); confettiRain(); SFX.win(); kazan('yapboz', $('#th'));
    if (word){ const sz = document.createElement('div'); sz.className = 'ypSoz'; sz.innerHTML = [...word].map((ch, i) => `<span style="--h:${hue(ch)};--i:${i}">${ch}</span>`).join(''); yp.appendChild(sz); await sleep(500); if (k !== tok) return; await clip('w_' + aid(word)); if (k !== tok) return; }
    await sleep(400); if (k !== tok) return; await line('yapboz_son'); if (k !== tok) return; await sleep(300); if (k !== tok) return; taskDone();
  }
  layout(); line('yapboz_ilk');
  return {layout, replay(){ line('yapboz_ilk'); }, reglow(){ if (wrong >= 2 && !bitti){ const p = parcalar.find(p => !p.classList.contains('yerde')); if (p) glowKey(harf[+p.dataset.i], true); } },
    onLetter(x){ const p = parcalar.find(p => !p.classList.contains('yerde') && harf[+p.dataset.i] === x); if (p) dene(p, +p.dataset.i); else harfSes(x); }};
};

// Hayvan besleme: kelime yazılınca hayvan büyür; yemeklere dokun (ya da harfine bas) yedir, hayvana dokun sev
ACT.sev = T => {
  const w = T.w, info = KELIMELER[w], known = bilinen(), k = tok, HEDEF = 6; let n = 0, bitti = false;
  const harfler = shuffle(known);
  scene.className = 'sev';
  scene.innerHTML = `<div class="sevWrap" id="sw"><div class="sevAd">${[...w].map(ch => `<span style="--h:${hue(ch)}">${ch}</span>`).join('')}</div>
    <div class="hayvan emo" id="hv">${info.e}</div>
    <div class="yemler" id="ym">${info.yem.map((y, i) => { const L = harfler[i % harfler.length]; return `<div class="yem" data-l="${L}" data-y="${y}" style="--h:${hue(L)}"><span class="emo">${y}</span><b>${L}</b></div>`; }).join('')}</div>
    ${araYildiz(HEDEF, '💖')}</div>`;
  function layout(){ const w2 = scene.clientWidth, h = scene.clientHeight; if (!w2 || !h) return; const yatay = h < 360 && w2 > h * 1.5; $('#sw').classList.toggle('yatay', yatay); $('#sw').style.setProperty('--hs', Math.round(Math.min(w2 * 0.4, h * (yatay ? 0.36 : 0.32), 200)) + 'px'); }
  const say = () => { araYak(n - 1); if (n >= HEDEF) finish(); };
  async function yedir(e){
    if (bitti || e.classList.contains('gitti')) return; stopLine(); harfSes(e.dataset.l, true);
    const hv = $('#hv'), r0 = e.getBoundingClientRect(), r1 = hv.getBoundingClientRect(), sr = $('#sw').getBoundingClientRect();
    const u = document.createElement('span'); u.className = 'ucan emo'; u.textContent = e.dataset.y; u.style.left = (r0.left + r0.width / 2 - sr.left) + 'px'; u.style.top = (r0.top + r0.height / 2 - sr.top) + 'px'; $('#sw').appendChild(u);
    e.classList.add('gitti'); requestAnimationFrame(() => requestAnimationFrame(() => { u.style.left = (r1.left + r1.width / 2 - sr.left) + 'px'; u.style.top = (r1.top + r1.height * 0.62 - sr.top) + 'px'; u.style.transform = 'translate(-50%,-50%) scale(.3)'; }));
    await sleep(520); u.remove(); if (k !== tok || bitti) return;
    hv.classList.remove('ye'); void hv.offsetWidth; hv.classList.add('ye'); SFX.pop(); burstAt(hv, 8, 'heart'); n++; say();
    setTimeout(() => e.classList.remove('gitti'), 1600);
    if (!bitti) line(rnd(['yem_1', 'yem_2', 'yem_3']));
  }
  function oksa(){
    if (bitti) return; const hv = $('#hv'); hv.classList.remove('sev'); void hv.offsetWidth; hv.classList.add('sev'); burstAt(hv, 12, 'heart'); SFX.twinkle(); n++; say();
    if (!bitti && n % 2 === 0){ stopLine(); line(rnd(['oks_1', 'oks_2', 'oks_3'])); }
  }
  async function finish(){
    bitti = true; const hv = $('#hv'); hv.classList.remove('ye', 'sev'); void hv.offsetWidth; hv.classList.add('mutlu'); confettiRain(); SFX.win(); kazan(info.c || 'kalp', hv);
    await sleep(700); if (k !== tok) return; await line('sev_son'); if (k !== tok) return; await sleep(300); if (k !== tok) return; taskDone();
  }
  $$('#ym .yem').forEach(e => e.addEventListener('pointerdown', ev => { ev.preventDefault(); yedir(e); }));
  $('#hv').addEventListener('pointerdown', ev => { ev.preventDefault(); oksa(); });
  layout(); line('sev_' + aid(w));
  return {layout, replay(){ line('sev_' + aid(w)); }, onLetter(x){ const e = $$('#ym .yem').find(e => e.dataset.l === x && !e.classList.contains('gitti')); if (e) yedir(e); else harfSes(x); }};
};

// Minik hikâye sahnesi: büyük resim, anlatıcı, Pamuk; "Devam" ile sıradaki
ACT.hikaye = T => {

  scene.className = 'hikaye'; $('#milaAv').hidden = true;

  function layout(){ const w = scene.clientWidth, h = scene.clientHeight; if (w && h) scene.classList.toggle('yatay', h < 360 && w > h * 1.5); }

};

function startFree(){ stopAll(); clearScene(); sahne('serbest'); kbLetters = ALFABE; setMode('serbest'); renderSteps(); renderKb(); act = ACT.serbest(); }

/* ============================================================ harita: Peri Bahçesi */
function showMap(){
  miniMod = null; stopAll(); clearScene(); sahne('map'); setMode('map'); renderSteps(); renderMap();
  const k = tok; line(mapSaid ? 'harita2' : 'harita').then(() => setTimeout(() => { if (k === tok && mode === 'map') setSay(''); }, 1200)); mapSaid = true;
}
function renderMap(){
  if (mode !== 'map') return;
  const w = scene.clientWidth || W, h = scene.clientHeight || H, N = DURAKLAR.length;
  const short = h < 420, cols = Math.max(3, Math.min(8, Math.floor(w / (short ? 100 : 112)))), rows = Math.ceil(N / cols);
  const avail = h - (short ? 104 : 134) - 48, cellW = w / cols, cellH = Math.max(short ? 76 : 92, Math.min(cellW * 1.05, 140, avail / rows));
  const nsz = Math.round(Math.max(60, Math.min(96, cellW * 0.66, cellH * 0.72))), cur = curStop();
  const pts = DURAKLAR.map((_, i) => { const r = Math.floor(i / cols), c = i % cols, cc = r % 2 ? cols - 1 - c : c; return [cellW * (cc + 0.5), cellH * (r + 0.5) + nsz * 0.25]; });
  let d = `M${pts[0]}`; for (let i = 1; i < pts.length; i++){ const [x0, y0] = pts[i - 1], [x1, y1] = pts[i]; d += y0 === y1 ? ` L${x1},${y1}` : ` C${x0 + (x0 > w / 2 ? 1 : -1) * cellW * 0.7},${y0} ${x1 + (x1 > w / 2 ? 1 : -1) * cellW * 0.7},${y1} ${x1},${y1}`; }
  const innerH = cellH * rows + nsz * 0.6;
  scene.className = 'map';
  scene.innerHTML = `<div class="mapScroll" id="ms"><div class="mapInner" style="width:${w}px;height:${innerH}px">
    <svg class="mpath" viewBox="0 0 ${w} ${innerH}"><path d="${d}" fill="none" stroke="#fff" stroke-width="${nsz * 0.34}" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
      <path d="${d}" fill="none" stroke="#ffc6df" stroke-width="5" stroke-dasharray="3 14" stroke-linecap="round"/></svg>
    ${DURAKLAR.map((D, i) => {
      const st = store.done[D.id] ? 'done' : '', c = i === cur && !store.done[D.id] ? 'cur' : '', lk = open(i) ? '' : 'lock';
      const inner = D.harf ? peri(D.harf) : D.ara ? `<span class="pe">${ARA[D.ara].e}</span>` : D.hikaye ? '<span class="pe">📜</span>' : resimHTML(KELIMELER[D.ikon]);
      const ad = D.harf ? D.harf + ' perisi' : D.ara ? ARA[D.ara].ad : D.hikaye ? HIKAYE[D.hikaye].ad : D.kelime.join(', ');
      return `<button class="stop ${D.harf ? '' : (D.ara || D.hikaye) ? 'ara' : 'kay'} ${st} ${c} ${lk}" style="--n:${nsz}px;left:${pts[i][0]}px;top:${pts[i][1]}px" data-i="${i}" title="${ad}">${inner}</button>`;
    }).join('')}
    <img class="mapMila" src="${YUZ}" alt="Mila" style="--m:${Math.round(nsz * 0.62)}px;left:${pts[cur][0]}px;top:${pts[cur][1] - nsz * 1.08}px">
  </div></div>
  <div class="mapBar"><button id="mBook">📖 Kitap</button><button id="mFun">🎪 Eğlence</button><button id="mFree">⌨️ Klavye</button></div>`;
  $$('#scene .stop').forEach(b => b.onclick = () => startStop(+b.dataset.i));
  $('#mBook').onclick = showBook; $('#mFree').onclick = startFree; $('#mFun').onclick = showEglence;
  const cy = pts[cur][1], ms = $('#ms'); if (ms.scrollHeight > ms.clientHeight) ms.scrollTop = Math.max(0, cy - ms.clientHeight / 2);
}

/* ============================================================ pencereler */
function showModal(html, buttons, wide){
  const card = $('#card'); card.classList.toggle('wide', !!wide); card.innerHTML = html + '<div class="row"></div>';
  const row = card.querySelector('.row');
  for (const b of buttons){ const e = document.createElement('button'); e.textContent = b.label; if (b.primary) e.className = 'primary'; e.onclick = b.action; row.appendChild(e); }
  $('#modal').hidden = false;
}
function closeModal(){ $('#modal').hidden = true; }
function showStory(then){
  store.storySeen = true; save();
  showModal(`<div class="story"><img src="../../ortak/resim/mila-prenses.webp" alt="Prenses Mila"><h2>📖 Sihirli kitap</h2><p>${SAY.hikaye[1]}</p></div>`,
    [{label:'🔈 Dinle', action:() => line('hikaye')}, {label:'Bahçeye git! ▶', primary:true, action:() => { stopLine(); closeModal(); then && then(); }}]);
  line('hikaye');
}
function showBook(){
  const harfler = DURAKLAR.filter(d => d.harf).map(d => store.done[d.id]
    ? `<div>${peri(d.harf)}${resimHTML(HARFLER[d.harf])}<small>${HARFLER[d.harf].k}</small></div>`
    : `<div class="yok"><b>?</b><small>&nbsp;</small></div>`).join('');
  const kel = Object.keys(KELIMELER).filter(w => store.words[w]), ck = Object.entries(store.cikartma || {}).filter(([, n]) => n > 0);
  showModal(`<h2>📖 Peri Kitabı</h2><p>Bir periye dokun, sesini duy!</p><div class="book" id="bk">${harfler}</div>
    <h3>✏️ Yazdığın kelimeler</h3>${kel.length ? `<div class="chips" id="bw">${kel.map(w => `<span data-w="${w}">${resimHTML(KELIMELER[w])}${w}</span>`).join('')}</div>` : '<p>Henüz kelime yok. Kaydıraklı çiçeklere git!</p>'}
    <h3>🎀 Çıkartmalarım</h3>${ck.length ? `<div class="cikartmalar">${ck.map(([id, n]) => `<span class="emo">${CIKARTMA[id]}${n > 1 ? `<i>${n}</i>` : ''}</span>`).join('')}</div>` : '<p>Henüz çıkartma yok. Balonlarda ve oyunlarda sürprizler var!</p>'}`,
    [{label:'Kapat', primary:true, action:closeModal}], true);
  $$('#bk .peri').forEach(e => e.onclick = () => { harfSes(e.dataset.l); e.classList.remove('tapped'); void e.offsetWidth; e.classList.add('tapped'); });
  $$('#bw span').forEach(e => e.onclick = () => clip('w_' + aid(e.dataset.w)));
}
function showParents(){
  const known = ALFABE.filter(L => store.letters[L]);
  const grid = known.length ? `<div class="lt-grid">${known.map(L => { const s = store.letters[L]; return `<div><b style="color:hsl(${hue(L)} 70% 55%)">${L}</b><span>${learned(L) ? '✅ öğrendi' : '🌱 öğreniyor'}<br><small>${s.ok} doğru · ${s.miss} ipucu</small></span></div>`; }).join('')}</div>` : '<p>Henüz oynanmadı.</p>';
  const m = store.kb || 'oto';
  showModal(`<h2>👪 Anne-baba köşesi</h2>
    <h3>Harfler</h3>${grid}
    <h3>Nasıl yardım edebilirsiniz?</h3><ul class="tips">
      <li>Günde 5 dakika yeter; bir durak bitince bırakmak en iyisi.</li>
      <li>Harfin <b>adını</b> değil <b>sesini</b> söyleyin: “me” değil “mmm”, “le” değil “lll”.</li>
      <li>Heceyi birlikte uzatın: “mmm-aaa… ma!” Sesler birleşince okuma başlar.</li>
      <li>Yanlış diye bir şey yok: yanlış periye dokununca peri kendi sesini söyler, iki denemeden sonra doğru tuş parlar.</li>
      <li>Okulda önce küçük harf öğretilir. Burada klavyeyle aynı olsun diye büyük harf kullanılıyor; tanışmada küçüğü de görünür.</li>
      <li>Bilgisayarda gerçek klavyeyle de oynanır: <b>Enter</b> sıradaki durağı açar, <b>Boşluk</b> sesi tekrar çalar, <b>Esc</b> bahçeye döner.</li>
    </ul>
    <h3>Klavye görünümü</h3><div class="seg" id="kbSeg">
      <button data-m="oto" class="${m === 'oto' ? 'on' : ''}">Otomatik</button><button data-m="klavye" class="${m === 'klavye' ? 'on' : ''}">⌨️ Bilgisayar klavyesi</button><button data-m="buyuk" class="${m === 'buyuk' ? 'on' : ''}">🔤 Büyük harfler</button></div>
    <h3>Duraklar</h3><div class="seg"><button id="pOpen" class="${store.allOpen ? 'on' : ''}">🔓 Bütün durakları aç</button><button id="pReset">🗑️ İlerlemeyi sıfırla</button></div>`,
    [{label:'Kapat', primary:true, action:closeModal}], true);
  $$('#kbSeg button').forEach(b => b.onclick = () => { store.kb = b.dataset.m; save(); renderKb(); showParents(); });
  $('#pOpen').onclick = () => { store.allOpen = !store.allOpen; save(); if (mode === 'map') renderMap(); showParents(); };
  $('#pReset').onclick = () => sifirlaSor(showParents);
}
function sifirlaSor(geri){
  showModal('<h2>🔄 Baştan başla?</h2><p>Bütün periler bahçeye döner, yazılan kelimeler ve harf istatistikleri silinir. Hikâye de baştan anlatılır.</p>',
    [{label:'Vazgeç', action:geri}, {label:'Evet, baştan başla', primary:true, action:() => {
      store.done = {}; store.letters = {}; store.words = {}; store.cikartma = {}; store.storySeen = false; save(); updateBook(); mapSaid = false; closeModal(); stopAll(); clearScene(); setMode('map'); renderMap(); showStory(showMap);
    }}]);
}
function showMenu(){

  const items = [
    ['🏠', 'Oyun Kulübü’ne dön', () => { location.href = '../../'; }],
