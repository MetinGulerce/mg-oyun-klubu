<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Orman ve Köy</title>
<meta name="theme-color" content="#fff6fb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MG Oyun">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="apple-touch-icon" href="../../ikonlar/ikon-180.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧺</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Titan+One&display=swap">
<style>
:root{
  --bg:#fbe4f0; --panel:#fff6fb; --panel2:#ffe1ef; --line:#f6bcd9;
  --text:#4a2545; --muted:#a3748f; --accent:#ff5fa2; --ok:#3fbf86; --gold:#f6c445;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font:15px/1.4 "Fredoka","Segoe UI",system-ui,sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}

header{display:flex;align-items:center;gap:8px 10px;padding:calc(7px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 7px calc(12px + env(safe-area-inset-left));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:18px;white-space:nowrap}
.brand span{color:var(--accent)}
#list{display:flex;gap:3px;align-items:center;padding:3px 8px;border-radius:999px;background:var(--panel2);border:1.5px solid var(--line);cursor:pointer;min-width:0}
#list .it{position:relative;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:19px;filter:grayscale(.85);opacity:.42;transition:transform .25s,opacity .25s,filter .25s}
#list .it.got{filter:none;opacity:1;background:#fff;box-shadow:0 1px 4px rgba(160,60,120,.18)}
#list .it.got::after{content:"✓";position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:50%;background:var(--ok);color:#fff;font-size:9px;font-weight:800;line-height:14px;text-align:center}
#list .it.pop{animation:itPop .6s cubic-bezier(.2,1.8,.4,1)}
@keyframes itPop{0%{transform:scale(.4)}60%{transform:scale(1.45)}100%{transform:scale(1)}}
#stars{display:flex;align-items:center;gap:4px;padding:5px 11px;border-radius:12px;background:#fff3c4;border:1.5px solid #f3d36b;font-weight:800;color:#7a5600;white-space:nowrap;font-variant-numeric:tabular-nums}
#stars.pop{animation:itPop .5s cubic-bezier(.2,1.8,.4,1)}
.spacer{flex:1}
.hb{padding:7px 13px;border-radius:12px;background:var(--panel2);border:1.5px solid var(--line);font-weight:700;white-space:nowrap}
#radioBtn{background:#d9c4ff;border-color:#c9a7ff}
#radioBtn.on{background:linear-gradient(90deg,#ff7eb6,#b26bff);color:#fff}
#menuBtn{background:var(--accent);color:#fff;border-color:var(--accent)}

#stage{position:relative;min-height:0;min-width:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#say{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:min(560px,calc(100% - 150px));padding:9px 16px;border-radius:16px;background:rgba(255,255,255,.94);box-shadow:0 3px 12px rgba(160,60,120,.18);font-size:16px;font-weight:600;text-align:center;cursor:pointer;z-index:3}
#say:empty{display:none}
#say .spk{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--panel2);margin-right:6px;vertical-align:middle;font-size:14px}
#say .who{display:block;font-size:11.5px;font-weight:700;color:var(--accent);margin-bottom:1px;letter-spacing:.02em}
#backBtn{position:absolute;left:10px;top:10px;z-index:4;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:14px;background:rgba(255,255,255,.94);border:2px solid var(--line);font-weight:800;box-shadow:0 3px 10px rgba(160,60,120,.18)}
#backBtn[hidden]{display:none}
#hud{position:absolute;right:10px;top:10px;z-index:3;display:flex;gap:6px;align-items:center}
#hud:empty{display:none}
#hud .h{padding:7px 13px;border-radius:14px;background:rgba(255,255,255,.95);box-shadow:0 3px 10px rgba(160,60,120,.18);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
#hud .h.pop{animation:itPop .45s cubic-bezier(.2,1.8,.4,1)}
#toast{position:absolute;left:50%;bottom:14px;transform:translate(-50%,20px);padding:9px 16px;border-radius:12px;background:#fff;border:1.5px solid var(--accent);opacity:0;transition:.2s;pointer-events:none;width:max-content;max-width:calc(100% - 24px);text-align:center;z-index:7;font-weight:600}
#toast.show{opacity:1;transform:translate(-50%,0)}

#modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(74,37,69,.38);z-index:8;padding:16px}
#modal[hidden]{display:none}
.card{max-height:100%;overflow:auto;width:min(480px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 24px;--cpb:22px;box-shadow:0 20px 60px rgba(120,40,90,.35)}
.card.wide{width:min(760px,100%)}
.card h2{margin:0 0 8px;font-size:22px}
.card h3{margin:16px 0 6px;font-size:16px}
.card p{margin:6px 0;color:#6b4263}
.card .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;position:sticky;bottom:calc(-1 * var(--cpb));margin-bottom:calc(-1 * var(--cpb));padding:10px 0 var(--cpb);background:linear-gradient(rgba(255,246,251,0),var(--panel) 38%)}   /* düğmeler kısa ekranda da hep görünür */
.card .row button{padding:10px 16px;border-radius:12px;background:var(--panel2);font-weight:700}
.card .row button.primary{background:var(--accent);color:#fff}
.card details{margin-top:8px;font-size:13px;color:var(--muted)}
.card summary{cursor:pointer;font-weight:700}
.card ul{margin:8px 0;padding-left:18px;color:#6b4263}
.card li{margin:5px 0}
.story{text-align:center}
.story .bigE{font-size:62px;line-height:1.1}
.story p{font-size:15.5px;line-height:1.55}
.qlist{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px;background:#fffdf5;border:2px dashed #f3d36b;border-radius:16px;padding:12px}
.qlist div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;font-weight:700;padding:6px 2px;border-radius:12px;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.08);position:relative}
.qlist div b{font-size:28px;line-height:1.1}
.qlist div.got{background:#e7fbef}
.qlist div.got::after{content:"✓";position:absolute;right:4px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--ok);color:#fff;font-size:10px;line-height:16px;text-align:center}
.qlist .sign{grid-column:1/-1;text-align:right;font-weight:700;color:var(--accent);background:none;box-shadow:none;align-items:flex-end;padding:0}
.kid{display:grid;gap:10px;margin:12px 0}
.kid div{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:14px;background:var(--panel2);font-size:15px;font-weight:600}
.kid b{font-size:30px;line-height:1;flex:none;width:40px;text-align:center}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;margin-top:8px;border-radius:12px;background:var(--panel2);border:2px solid transparent;font-weight:600;text-align:left}
.mi:hover{border-color:var(--accent)}
.mi.danger{background:#ffe1dc;color:#a3271a}
.mi .e{font-size:20px}
.ml{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0 8px}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:10px}
.album div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;border-radius:16px;background:var(--panel2);font-size:12px;font-weight:700;text-align:center;border:2px dashed transparent}
.album div b{font-size:38px;line-height:1.1}
.album div.got{background:#fff;border:2px solid var(--line);box-shadow:0 2px 0 var(--line)}
.album div:not(.got) b{filter:brightness(0) opacity(.18)}
.album div:not(.got) span{color:var(--muted)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px}
.shop button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 6px 9px;border-radius:16px;background:var(--panel2);border:3px solid transparent;font-weight:700;font-size:13px}
.shop button canvas{width:100%;height:84px;border-radius:12px;background:linear-gradient(#e3f4ff,#fdeaf4)}
.shop button .pr{font-size:12px;color:var(--muted)}
.shop button.own .pr{color:var(--ok)}
.shop button.on{border-color:var(--accent);background:#ffd0e4}
.basket{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-size:30px;margin:8px 0}

#celebrate{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:6;overflow:hidden;animation:milaOut .6s ease-in 3s forwards}
#celebrate[hidden]{display:none}
#celebrate::before{content:"";position:absolute;left:50%;top:50%;width:160vmax;height:160vmax;margin:-80vmax 0 0 -80vmax;
  background:repeating-conic-gradient(rgba(255,226,120,.55) 0 9deg,rgba(255,226,120,0) 9deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 42%);mask:radial-gradient(circle,#000 0,transparent 42%);animation:milaSpin 9s linear infinite}
#celebrate .stack{position:relative;display:flex;flex-direction:column;align-items:center}
#celebrate .crownTop{font-size:clamp(46px,9vw,110px);line-height:1;margin-bottom:-.1em;animation:milaIn .8s cubic-bezier(.2,1.6,.4,1) .55s both}
#celebrate .word{display:flex;font:400 clamp(80px,19vw,240px)/1.05 "Titan One","Fredoka","Arial Black",sans-serif;letter-spacing:.03em}
#celebrate .word span{display:inline-block;color:var(--c);-webkit-text-stroke:.06em #fff;paint-order:stroke fill;
  text-shadow:0 .03em 0 var(--d),0 .06em 0 var(--d),0 .09em 0 var(--d),0 .12em 0 var(--d),0 .17em .08em rgba(80,20,60,.45);
  animation:milaIn .9s cubic-bezier(.2,1.6,.4,1) both,milaWob 1.1s ease-in-out infinite;animation-delay:calc(var(--i)*.13s),calc(.9s + var(--i)*.13s)}
#celebrate .sub{font:700 clamp(18px,3.4vw,38px)/1 "Fredoka",sans-serif;color:#fff;background:linear-gradient(90deg,#ff5fa2,#b26bff);padding:.35em 1.1em;border-radius:999px;margin-top:.45em;box-shadow:0 .2em 0 rgba(120,30,90,.35);animation:milaIn .7s cubic-bezier(.2,1.6,.4,1) .8s both}
@keyframes milaIn{from{transform:translateY(-130%) scale(.2) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
@keyframes milaWob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-9%) rotate(4deg) scale(1.06)}}
@keyframes milaSpin{to{transform:rotate(360deg)}}
@keyframes milaOut{to{opacity:0;transform:scale(1.35)}}
*{scrollbar-width:thin;scrollbar-color:#f3b9d4 transparent}
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-thumb{background:#f3b9d4;border-radius:8px}
*::-webkit-scrollbar-track{background:transparent}

@media (max-width:820px){
  .brand{display:none}
}
/* dik telefon */
@media (max-width:600px){
  header{gap:4px;padding:calc(6px + env(safe-area-inset-top)) calc(7px + env(safe-area-inset-right)) 6px calc(7px + env(safe-area-inset-left))}
  .lbl,.spacer{display:none}
  #list{flex:1;justify-content:space-between;padding:3px 5px;gap:1px}
  #list .it{width:28px;height:28px;font-size:16px;flex:0 1 28px;min-width:0}
  #stars{padding:5px 6px;font-size:14px}
  .hb{padding:6px 8px;font-size:15px}
  #fsBtn{padding:6px 7px}
  #say{font-size:14px;max-width:calc(100% - 20px);top:auto;bottom:10px}
  body.ingame #say{top:58px;bottom:auto}
  #hud .h{font-size:15px;padding:6px 10px}
  #backBtn{padding:7px 11px;font-size:14px}
  .qlist{grid-template-columns:repeat(4,1fr);padding:8px;gap:6px}
  .qlist div b{font-size:24px}
}
/* yatay telefon */
@media (orientation:landscape) and (max-height:520px){
  header{padding:calc(4px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 4px calc(10px + env(safe-area-inset-left));gap:6px}
  .brand,.lbl{display:none}
  #list .it{width:28px;height:28px;font-size:16px}
  .hb{padding:0 12px;height:32px;font-size:15px}
  #stars{padding:3px 10px}
  #say{font-size:13.5px;top:8px;padding:6px 12px;max-width:calc(100% - 260px)}
  #modal{padding:8px}
  .card{padding:14px 18px;--cpb:14px}
  .card h2{font-size:18px}
  .card .row{margin-top:10px}
  .story .bigE{font-size:38px}
  .story p{font-size:14px;line-height:1.45}
  .qlist{grid-template-columns:repeat(8,1fr);gap:5px;padding:8px}
  .qlist div{font-size:10.5px}
  .qlist div b{font-size:22px}
  .kid{gap:6px;margin:8px 0}
  .kid div{padding:5px 10px;font-size:14px}
  .kid b{font-size:24px}
}
@media (prefers-reduced-motion:reduce){#celebrate .word span,#list .it.pop{animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">🧺 Orman <span>ve Köy</span></div>
    <div id="list" title="Kraliçe annenin listesi"></div>
    <div id="stars" title="Yıldızlar: Prenses Butiği'nde harcanır">⭐ 0</div>
    <div class="spacer"></div>
    <button class="hb" id="fsBtn" title="Tam ekran" hidden></button>
    <button class="hb" id="radioBtn" title="Radyo: Mila FM">📻<span class="lbl"> Radyo</span></button>
    <button class="hb" id="menuBtn" title="Menü">☰<span class="lbl"> Menü</span></button>
  </header>
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="say"></div>
    <button id="backBtn" hidden title="Yola dön">⬅ Yola dön</button>
    <div id="hud"></div>
    <div id="toast"></div>
    <div id="celebrate" hidden></div>
    <div id="modal" hidden><div class="card" id="card"></div></div>
  </main>
</div>
<script src="../../ortak/mila-fm.js"></script>
<script src="../../ortak/mobil.js"></script>
<script>
(() => {
'use strict';
/* ============================================================ temel */
const $ = s => document.querySelector(s);
const cv = $('#cv'); let ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;
const rnd = a => a[Math.random() * a.length | 0];
const rr = (a, b) => a + Math.random() * (b - a);
const ease = k => k * k * (3 - 2 * k);
const PASTEL = ['#ff7eb6', '#ffb13d', '#ffe95c', '#8fe3a1', '#7cc8ff', '#c9a7ff'];
const EMO = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
let simT = 0;   // yalnızca konsoldaki deneme aracı (__ovk.step) zamanı ileri sarar
const now = () => performance.now() / 1000 + simT;

/* ============================================================ veri */
// Kraliçe annenin listesi (Pasta Atölyesi'ndeki malzemelerle aynı sırada)
const ITEMS = [
  {k:'un',       e:'🌾', n:'Un',       from:'degirmen'},
  {k:'yumurta',  e:'🥚', n:'Yumurta',  from:'kumes'},
  {k:'seker',    e:'🍬', n:'Şeker',    from:'sekerci'},
  {k:'sut',      e:'🥛', n:'Süt',      from:'ahir'},
  {k:'tereyagi', e:'🧈', n:'Tereyağı', from:'ahir'},
  {k:'cilek',    e:'🍓', n:'Çilek',    from:'cilek'},
  {k:'vanilya',  e:'🍦', n:'Vanilya',  from:'peri'},
  {k:'cikolata', e:'🍫', n:'Çikolata', from:'peri'},
];
const ITEM = Object.fromEntries(ITEMS.map(i => [i.k, i]));
// Yol üstündeki duraklar (x: dünya metresi)
const STATIONS = [
  {id:'cilek',    x:24,  name:'Çilek Tarlası', e:'🍓', who:'mila',   items:['cilek']},
  {id:'peri',     x:46,  name:'Peri Bahçesi',  e:'🧚', who:'peri',   items:['vanilya', 'cikolata']},
  {id:'degirmen', x:70,  name:'Değirmen',      e:'🌾', who:'findik', items:['un']},
  {id:'kumes',    x:92,  name:'Kümes',         e:'🐔', who:'mila',   items:['yumurta']},
  {id:'ahir',     x:110, name:'Ahır',          e:'🐄', who:'nine',   items:['sut', 'tereyagi']},
  {id:'sekerci',  x:128, name:'Şekerci',       e:'🍬', who:'lale',   items:['seker']},
];
const ST = Object.fromEntries(STATIONS.map(s => [s.id, s]));
const WORLD_X0 = -9, WORLD_X1 = 152;
// Çıkartmalar: yolda ve mini oyunlarda saklı sürprizler
const STICKERS = [
  ['kelebek', '🦋', 'Kelebek'], ['ugur', '🐞', 'Uğur Böceği'], ['tavsan', '🐰', 'Pıtırcık'], ['kirpi', '🦔', 'Kirpi'],
  ['sincap', '🐿️', 'Sincap'], ['baykus', '🦉', 'Baykuş'], ['peri', '🧚', 'Peri Işıltı'], ['findik', '🐭', 'Fındık'],
  ['civciv', '🐥', 'Civciv'], ['altin', '🥚', 'Altın Yumurta'], ['horoz', '🐓', 'Horoz'], ['benekli', '🐄', 'Benekli'],
  ['ayran', '🥛', 'Ayran Bıyığı'], ['lolipop', '🍭', 'Lolipop'], ['kurbaga', '🐸', 'Kurbağa'], ['gokkusagi', '🌈', 'Gökkuşağı'],
];
const STK = Object.fromEntries(STICKERS.map(s => [s[0], s]));
// Prenses Butiği: Mila'nın elbisesi, tacı ve sepet kurdelesi (bütün oyunlarda görünür)
const DRESSES = {pembe:['Pembe', '#ff9ccb', 0], lila:['Lila', '#c9a7ff', 6], nane:['Nane', '#8fe3b9', 6], mavi:['Gök Mavisi', '#8fd0ff', 6], sari:['Güneş', '#ffd76a', 8], mercan:['Mercan', '#ff9f8a', 8], gokkusagi:['Gökkuşağı', 'rainbow', 15]};
const CROWNS = {altin:['Altın Taç', 0], cicek:['Çiçek Taç', 8], yildiz:['Yıldız Taç', 10], kalp:['Kalpli Taç', 10]};

// Seslendirilen satırlar: araclar/seslendir.py bu listeyi okuyup ses/<anahtar>.mp3 dosyalarını üretir.
// Konuşan: anlatici | mila | kralice | kral | bebek | peri | findik | nine | lale
const SAY = {
  hikaye:        ['anlatici', "Bir varmış bir yokmuş... Yarın unicorn Pamuk'un doğum günü! Prenses Mila ona kocaman bir pasta yapmak istiyor. Ama şatonun mutfağında ne un kalmış ne de yumurta! Kraliçe anne Mila'ya resimli bir liste verdi: Ormandan ve köyden bunları topla tatlım. Ama akşama fırtına çıkacakmış, hava kararmadan dön! Mila sepetini kaptı ve yola koyuldu."],
  liste:         ['kralice', 'Listemiz şöyle: un, yumurta, şeker, süt ve tereyağı. Bir de çilek, vanilya ve çikolata! Dikkatli ol tatlım!'],
  yardim:        ['anlatici', 'Gitmek istediğin yere dokun, Mila oraya yürüsün. Parlayan yerlere dokunursan Mila orada yardım eder ve malzemeleri sepetine koyar. Yolda kelebekleri, yıldızları ve saklanan hayvanları da bulabilirsin!'],
  yola:          ['mila', 'Hadi bakalım, malzeme toplamaya!'],
  cilek_gel:     ['mila', 'Ooo, çilek tarlası! Kıpkırmızı olanları toplayalım.'],
  cilek_nasil:   ['anlatici', 'Kırmızı çileklere dokun. Yeşil olanlar henüz olmamış, biraz beklemek lazım. Yaprakların altına da bak!'],
  cilek_olmadi:  ['mila', 'Bu daha yeşil, biraz bekleyelim!'],
  cilek_bitti:   ['mila', 'Sepetim çilek doldu! Mis gibi kokuyorlar!'],
  peri_gel:      ['peri', 'Merhaba prenses! Ben Peri Işıltı. Vanilya çiçeklerim şarkı söylemeyi çok sever!'],
  peri_dinle:    ['peri', 'Önce ben çalayım, sonra sen aynısını çal!'],
  peri_sira:     ['peri', 'Sıra sende!'],
  peri_tekrar:   ['peri', 'Hımm, bir daha dinleyelim!'],

function walkTo(x, then){

function updateWorld(d, t){
  if (!finale){
    const dx = mila.tx - mila.x, dist = Math.abs(dx);
    if (dist > 0.04){
      const sp = dist > 6 ? Math.min(16, 3.8 + (dist - 6) * 0.55) : 3.8, step = Math.min(dist, sp * d);   // uzak yere koşarak gider
      mila.x += Math.sign(dx) * step; mila.dir = Math.sign(dx); mila.ph += step * (sp > 6 ? 1.6 : 2.4); mila.moving = true; mila.sp = sp; SFX.step();
    } else if (mila.moving){ mila.moving = false; mila.x = mila.tx; store.x = mila.x; saveStore(); const f = mila.then; mila.then = null; if (f) f(); }
    else mila.moving = false;
  } else updateFinale(d, t);
  mila.hop = Math.max(0, mila.hop - d * 3);
  if (mila.wave > 0) mila.wave -= d;
  if (mila.mustache > 0 && !finale) mila.mustache -= d * 0.02;
  // kamera Mila'yı izler (biraz önüne bakar)
  const target = finale && finale.car && finale.phase === 'ride' ? finale.car.x - 2 : mila.x + mila.dir * 1.8;

  cam.x += (clamp(target, WORLD_X0 + hw, WORLD_X1 - hw) - cam.x) * (1 - Math.exp(-d * (3 + (mila.moving ? (mila.sp || 0) * 0.5 : 0))));

  }
  function segHit(a, b, s){   // a-b parmak yolu, başak gövdesi kesişiyor mu

      ctx.strokeStyle = 'rgba(169,116,79,.45)'; ctx.lineWidth = s * 0.012; for (let k = 1; k < 4; k++){ ctx.beginPath(); ctx.moveTo(s * 0.025, -s * 0.96 + k * s * 0.175); ctx.lineTo(s * 0.265, -s * 0.96 + k * s * 0.175); ctx.stroke(); }

    ctx.fillStyle = '#c9a46a'; ctx.font = `700 ${L.u * 0.32}px Fredoka,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('UN', 0, -h * 0.45);

      for (const s of stalks){
        ctx.save(); ctx.translate(s.x, s.base); ctx.scale(L.u, L.u);
        const hh = s.h / L.u, bunch = (cut) => { drawWheat(ctx, -0.16, hh * 0.9, t + 0.7, 0, cut); drawWheat(ctx, 0.17, hh * 0.94, t + 1.3, 0, cut); drawWheat(ctx, 0, hh, t, 0, cut); };
        if (!s.cut) bunch(false);
        else { bunch(true); const k = Math.min(1, (t - s.cutT) / 0.7); if (k < 1){ ctx.globalAlpha = 1 - k; ctx.translate(0, -hh * s.cutAt + k * 0.8); ctx.rotate(k * 1.6); drawWheat(ctx, -0.16, hh * (0.9 - s.cutAt), t, 0, false); drawWheat(ctx, 0.17, hh * (0.94 - s.cutAt), t, 0, false); drawWheat(ctx, 0, hh * (1 - s.cutAt), t, 0, false); ctx.globalAlpha = 1; } }

function indoorBG(kind, t, floorY){

  else { ctx.strokeStyle = 'rgba(140,90,50,.22)'; ctx.lineWidth = 2; for (let y = 24; y < floorY; y += 34){ ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); } for (let i = 0; i < 30; i++){ const x = (i * 131) % W, y = 24 + ((i * 7) % Math.max(1, Math.floor(floorY / 34))) * 34; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 34); ctx.stroke(); } }
  const fg = ctx.createLinearGradient(0, floorY, 0, H); fg.addColorStop(0, kind === 'dukkan' ? '#e7c0a0' : '#f2d27a'); fg.addColorStop(1, kind === 'dukkan' ? '#cf9f7c' : '#ddb35a');
  ctx.fillStyle = fg; ctx.fillRect(0, floorY, W, H - floorY);

  try { localStorage.removeItem('mg-kulup-sepet'); } catch (e) {}
  finale = null; stormBoost = 0; mila.x = mila.tx = 3; mila.dir = 1; cam.x = 5; renderList(); closeModal(); toast('🌱 Yeni bir gün başladı!');
  showStory(() => showList(true));
}
function showAlbum(){
  const got = STICKERS.filter(s => store.stickers[s[0]]).length;
  showModal(`<h2>🌟 Çıkartma albümü <span style="font-size:15px;color:var(--muted)">${got}/${STICKERS.length}</span></h2><p style="font-size:13px;color:var(--muted)">Yolda ve duraklarda saklanan sürprizleri bul! Kelebekleri yakala, hayvanlara dokun, yaprakların altına bak…</p>
    <div class="album">${STICKERS.map(([k, e, n]) => `<div class="${store.stickers[k] ? 'got' : ''}"><b>${e}</b><span>${store.stickers[k] ? n : '?'}</span></div>`).join('')}</div>`,
    [{label:'Kapat', primary:true, action:closeModal}], true);
}
function showShop(){
  const keepScroll = modalOpen() && $('#shopD') ? $('#card').scrollTop : 0;   // satın alınca liste yerinde kalsın
  showModal(`<h2>👗 Prenses Butiği</h2><p>Yıldızlarınla Mila'ya elbise ve taç al! Seçtiğin kıyafet <b>bütün oyunlarda</b> görünür. Yıldızların: <b>⭐ ${store.stars}</b></p>
    <h3>Elbiseler</h3><div class="shop" id="shopD"></div><h3>Taçlar</h3><div class="shop" id="shopC"></div>`, [{label:'Kapat', primary:true, action:closeModal}], true);
  if (lim('butikSes', 20000)) voice('butik');
  const mk = (host, kind, k, name, price) => {
    const own = !!store.owned[kind][k], on = (kind === 'dress' ? store.dress : store.crown) === k, b = document.createElement('button');
    b.className = (own ? 'own' : '') + (on ? ' on' : '');
    b.innerHTML = `<canvas></canvas><span>${name}</span><span class="pr">${on ? 'Giyiliyor ✓' : own ? 'Senin — giy' : `⭐ ${price}`}</span>`;
    b.onclick = () => {
      if (!own){ if (store.stars < price){ SFX.nope(); toast('Yeterli yıldız yok ⭐ Kelebek yakala, çalıları salla!'); return; } store.stars -= price; store.owned[kind][k] = 1; SFX.magic(); toast(`✨ ${name} senin!`); }
      else SFX.pick();
      if (kind === 'dress') store.dress = k; else store.crown = k;
      saveStore(); saveLook(); renderList(); showShop();
    };
    host.appendChild(b);
    const cvs = b.querySelector('canvas'), r = cvs.getBoundingClientRect(), dp = Math.min(2, window.devicePixelRatio || 1);
    cvs.width = r.width * dp; cvs.height = r.height * dp;
    const c = cvs.getContext('2d'), keep = [store.dress, store.crown]; c.setTransform(dp, 0, 0, dp, 0, 0);
    if (kind === 'dress') store.dress = k; else store.crown = k;
    drawMila(c, r.width / 2 - 4, r.height - 4, r.height * 0.9, 0.3, {dir:1});
    [store.dress, store.crown] = keep;
  };
  for (const [k, [name, , price]] of Object.entries(DRESSES)) mk($('#shopD'), 'dress', k, name, price);
  for (const [k, [name, price]] of Object.entries(CROWNS)) mk($('#shopC'), 'crown', k, name, price);
  $('#card').scrollTop = keepScroll;
}
function celebrate(sub){
  const el = $('#celebrate'), lc = [['#ff4f9a', '#c2185b'], ['#ffb300', '#c77800'], ['#2fcf8f', '#158a5a'], ['#4da6ff', '#1f6fc2']];
  el.innerHTML = '<div class="stack"><div class="crownTop">👑</div><div class="word">' + [...'MİLA'].map((ch, i) => `<span style="--i:${i};--c:${lc[i][0]};--d:${lc[i][1]}">${ch}</span>`).join('') + `</div><div class="sub">${sub}</div></div>`;
  el.hidden = false; clearTimeout(celebrate.h); celebrate.h = setTimeout(() => { el.hidden = true; }, 3700);
  SFX.win(); for (let i = 0; i < 6; i++) setTimeout(() => burst(W * (0.15 + Math.random() * 0.7), H * (0.2 + Math.random() * 0.4), 26, PASTEL, i % 2 ? 'star' : 'heart'), i * 280);
}
function finishGame(){
  store.finished = true; saveStore();
  try { localStorage.setItem('mg-kulup-sepet', JSON.stringify({when:Date.now(), items:ITEMS.map(i => i.k), extra:['kiraz', 'lolipop']})); } catch (e) {}
  showModal(`<div class="story"><div class="bigE">🏰🧺💖</div><h2>Sepet doldu!</h2><div class="basket">${ITEMS.map(i => `<span title="${i.n}">${i.e}</span>`).join('')}</div><p>${plain(SAY.bitti[1])}</p>
    <p style="font-size:13px;color:var(--muted)">Topladığın malzemeler Pasta Atölyesi'nde seni bekliyor. İstersen yolda dolaşıp kelebek yakalamaya, butikten elbise almaya devam edebilirsin.</p></div>`,
    [{label:'🔈 Dinle', action:() => voice('bitti')}, {label:'Yolda gez', action:() => { stopVoice(); closeModal(); finale = null; stormBoost = 0; }},
     {label:'🧁 Pastayı yapalım! ▶', primary:true, action:() => { location.href = '../pasta-atolyesi/'; }}]);
  voice('bitti', true);
}

/* ============================================================ mini oyuna giriş/çıkış (perde geçişi) */
let game = null, iris = null;
function irisTo(x, y, then){ iris = {t:0, x, y, phase:'close', then}; }
function openGame(id){
  if (game || iris || !GAMES[id]) return;
  stopVoice(); setSay('');
  irisTo(wx2s(mila.x), wy2s(-1.2), () => {
    game = {id, G:GAMES[id](), t:0};
    game.G.lay(); $('#backBtn').hidden = false; document.body.classList.add('ingame');
    game.G.start && game.G.start(now());
  });
}
function closeGame(after){
  if (!game || iris) return;
  const g = game; g.closing = true;   // perde kapanırken oyun durur (HUD ve replikler dünyaya sızmasın)
  stopVoice(); setSay(''); hudSet('');
  irisTo(W / 2, H / 2, () => { game = null; stopVoice(); setSay(''); hudSet(''); $('#backBtn').hidden = true; document.body.classList.remove('ingame'); layoutWorld(); g.afterWin && g.afterWin(); after && after(); });
}
const alive = G => !!(game && game.G === G && !game.closing);   // gecikmeli işler yalnızca aynı oyun açıkken çalışsın
const lockBack = () => { $('#backBtn').hidden = true; };   // hedefe ulaşıldı: kutlama bitmeden çıkılmasın
function winGame(id, G){
  if (!game || game.id !== id || game.won || game.closing || (G && game.G !== G)) return;
  game.won = true; lockBack();
  const st = ST[id], first = !store.done[id];
  store.done[id] = true; for (const k of st.items) store.items[k] = true; saveStore();
  celebrate(first ? `${st.items.map(k => ITEM[k].e).join(' ')} SEPETTE!` : '✨ HARİKA! ✨');
  addStars(first ? 3 : 1, W / 2, H / 2);
  game.afterWin = () => {   // dünyaya dönünce (nasıl dönülürse dönülsün) bir kez çalışır
    renderList(st.items); mila.dir = 1; mila.hop = 0.6; mila.wave = 1.5;
    if (doneCount() >= STATIONS.length && !store.finished) setTimeout(startFinale, 1200);
    else if (first){ const nx = nextStation(); if (nx) setTimeout(() => toast(`Sıradaki durak: ${nx.e} ${nx.name} →`), 900); }
  };
  const g = game; setTimeout(() => { if (game === g) closeGame(); }, 3300);
}
function drawIris(d){
  if (!iris) return;
  iris.t += d / 0.45;
  const R = Math.hypot(W, H), k = Math.min(1, iris.t), r = iris.phase === 'close' ? R * (1 - ease(k)) : R * ease(k);
  screenT(); ctx.fillStyle = '#ff9ccb'; ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.arc(iris.x, iris.y, Math.max(0.1, r), 0, Math.PI * 2, true); ctx.fill('evenodd');
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(iris.x, iris.y, Math.max(0.1, r), 0, 7); ctx.stroke();
  for (let i = 0; i < 10; i++){ const a = i / 10 * Math.PI * 2 + iris.t * 2; heart(ctx, iris.x + Math.cos(a) * (r + 22), iris.y + Math.sin(a) * (r + 22), 14, PASTEL[i % 6]); }
  if (k >= 1){
    if (iris.phase === 'close'){ const f = iris.then; iris = {t:0, x:W / 2, y:H / 2, phase:'open'}; f && f(); }
    else iris = null;
  }
}

/* ============================================================ girdi */
const pos = e => { const r = cv.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; };
cv.addEventListener('contextmenu', e => e.preventDefault());
let ptrDown = false;
cv.addEventListener('pointerdown', e => {
  audioCtx();
  if (modalOpen() || iris || !e.isPrimary) return;   // ikinci parmak sürüklenen şeyi kaçırmasın
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  ptrDown = true;
  const p = pos(e), t = now();
  if (game){ game.G.down && game.G.down(p, e, t); return; }
  if (finale) return;
  hitWorld(p.x, p.y, t);
});
cv.addEventListener('pointermove', e => { if (!ptrDown || iris || !e.isPrimary) return; if (game && game.G.move) game.G.move(pos(e), e, now()); });
const endPtr = e => { if (!ptrDown || !e.isPrimary) return; ptrDown = false; if (game && game.G.up) game.G.up(pos(e), e, now()); };
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
window.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if (modalOpen() && store.storySeen) closeModal(); return; }
  if (modalOpen() || game || finale || iris) return;
  if (e.key === 'ArrowRight'){ e.preventDefault(); walkTo(mila.x + 3); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); walkTo(mila.x - 3); }
  else if (e.key === 'Enter' || e.code === 'Space'){ e.preventDefault(); const s = STATIONS.find(s => Math.abs(s.x - mila.x) < 6); if (s) goStation(s); }
});

/* ============================================================ döngü */
function resize(){
  const r = $('#stage').getBoundingClientRect(); DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(50, r.width); H = Math.max(50, r.height);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  layoutWorld(); if (game) game.G.lay();
}
let last = performance.now();
function tick(d, t){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (game){ game.t += d; if (!game.closing && game.G.update) game.G.update(d, t); screenT(); game.G.draw(t); drawParts(d); }
  else { updateWorld(d, t); drawWorld(t, d); }
  drawIris(d);
}
function frame(nowMs){
  const d = Math.min(0.05, (nowMs - last) / 1000); last = nowMs;
  if (W) tick(d, nowMs / 1000 + simT);
  requestAnimationFrame(frame);
}

/* ============================================================ başlat */
$('#menuBtn').onclick = showMenu;
$('#list').onclick = () => showList(true);
$('#stars').onclick = () => { if (!game && !finale) showShop(); };
$('#say').onclick = () => { if (sayId) voice(sayId); };
$('#backBtn').onclick = () => closeGame();
MilaFM.init({button:$('#radioBtn'), host:$('#stage')});
if (window.MGMobil) MGMobil.init({yatay:true, yatayNeden:'Yol ve köy kocaman görünür, Mila\'yı parmağınla çok daha rahat yürütürsün.'});
renderList(); saveLook();
new ResizeObserver(resize).observe($('#stage'));
resize(); cam.x = mila.x + 2;
if (!store.storySeen) showStory(() => showList(true, () => { if (!store.helpSeen) showHelp(); else sayLine('yola'); }));
else if (!store.helpSeen) showHelp();
else if (!store.finished && doneCount() >= STATIONS.length) setTimeout(() => { if (!game && !finale && !modalOpen()) startFinale(); }, 1500);   // final yarıda kaldıysa yeniden başlar
else setTimeout(() => { const nx = nextStation(); if (nx && !store.finished) toast(`Sıradaki durak: ${nx.e} ${nx.name}`); }, 600);
requestAnimationFrame(frame);

// Konsoldan deneme için küçük bir API
window.__ovk = {get store(){ return store; }, get game(){ return game; }, mila, cam, openGame, closeGame, winGame, startFinale, walkTo, GAMES, STATIONS, get finale(){ return finale; },
  step(sec){ for (let i = 0; i < sec * 30; i++){ simT += 1 / 30; tick(1 / 30, now()); } },
  tap(x, y, type = 'touch'){ const r = cv.getBoundingClientRect(); for (const ev of ['pointerdown', 'pointerup']) cv.dispatchEvent(new PointerEvent(ev, {pointerId:9, pointerType:type, isPrimary:true, button:0, buttons:ev === 'pointerdown' ? 1 : 0, clientX:r.left + x, clientY:r.top + y, bubbles:true})); },
  drag(pts, type = 'touch'){ const r = cv.getBoundingClientRect(); pts.forEach(([x, y], i) => cv.dispatchEvent(new PointerEvent(i === 0 ? 'pointerdown' : i === pts.length - 1 ? 'pointerup' : 'pointermove', {pointerId:9, pointerType:type, isPrimary:true, button:i === 0 || i === pts.length - 1 ? 0 : -1, buttons:i === pts.length - 1 ? 0 : 1, clientX:r.left + x, clientY:r.top + y, bubbles:true}))); },
  win(id){ if (game) winGame(game.id); }, skip(id){ store.done[id] = true; for (const k of ST[id].items) store.items[k] = true; saveStore(); renderList(); }};
})();
</script>
