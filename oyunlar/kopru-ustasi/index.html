<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Köprü Ustası</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Titan+One&display=swap">
<style>
:root{
  --bg:#fbe4f0; --panel:#fff6fb; --panel2:#ffe1ef; --line:#f6bcd9;
  --text:#4a2545; --muted:#a3748f; --accent:#ff5fa2; --accent-ink:#fff;
  --danger:#e5533f; --ok:#3fbf86;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.4 "Fredoka","Nunito","Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

header{display:flex;align-items:center;gap:10px 18px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:800;font-size:17px;letter-spacing:.2px;white-space:nowrap}
.brand span{color:var(--accent)}
#levels{display:flex;align-items:center;gap:1px;padding:3px 10px;border-radius:999px;background:var(--panel2);border:1.5px solid var(--line)}
.stop{width:24px;height:28px;display:grid;place-items:center;font-size:13px;position:relative;padding:0}
.stop::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1px;background:var(--line)}
.stop span{position:relative}
.stop.locked{cursor:default}
.stop.locked span{width:8px;height:8px;border-radius:50%;background:#e6c3d8;display:block}
.stop.cur span{font-size:19px;filter:drop-shadow(0 1px 2px rgba(120,40,90,.4))}
.stop.end{font-size:18px;cursor:default}
.story{text-align:center}
.story .big{font-size:64px;line-height:1.1}
.story p{font-size:15px;line-height:1.55}
.myCake{display:flex;align-items:center;gap:12px;margin:10px auto 0;padding:8px 14px;border-radius:16px;background:var(--panel2);max-width:340px;text-align:left;font-size:13px;font-weight:600;color:var(--text);text-decoration:none}
.myCake img{width:96px;height:80px;object-fit:contain;flex:none;filter:drop-shadow(0 3px 5px rgba(120,40,90,.25))}
a.myCake:hover{outline:2px solid var(--accent)}
.chip{width:32px;height:32px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-weight:700;position:relative}
.chip:hover{border-color:var(--muted)}
.chip.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.done::after{content:"♥";position:absolute;right:-4px;top:-6px;font-size:10px;width:15px;height:15px;line-height:15px;border-radius:50%;background:var(--accent);color:#fff}
#levelInfo{display:flex;flex-direction:column;line-height:1.2;min-width:0}
#levelName{font-weight:700}
#levelSub{color:var(--muted);font-size:12px}
#budget{margin-left:auto;min-width:230px}
#budgetText{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted)}
#budgetText b{color:var(--text);font-size:14px;font-variant-numeric:tabular-nums}
#budget.over #budgetText b{color:var(--danger)}
#bar{height:7px;border-radius:4px;background:var(--panel2);margin-top:4px;overflow:hidden}
#barFill{height:100%;width:0;background:var(--ok);border-radius:4px;transition:width .15s}
#budget.over #barFill{background:var(--danger)}
#vehBtn{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:12px;background:var(--panel2);border:1.5px solid var(--line);font-weight:600}
#vehBtn:hover{border-color:var(--accent)}
#bank{padding:6px 12px;border-radius:12px;background:#fff3c4;border:1.5px solid #f3d36b;font-weight:700;color:#7a5600;white-space:nowrap;font-variant-numeric:tabular-nums}
#garage{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:12px}
.veh{display:flex;flex-direction:column;align-items:stretch;text-align:left;padding:8px 10px 10px;border-radius:14px;background:var(--panel2);border:2px solid transparent}
.veh:hover{border-color:var(--line)}
.veh.sel{border-color:var(--accent);background:#ffd0e4}
.veh canvas{width:100%;height:112px;border-radius:10px;background:linear-gradient(#d9f0ff,#ffe9f4)}
.veh .vn{font-weight:700;font-size:15px;margin-top:6px}
.veh .vs{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-top:2px}
.veh .vs b{color:var(--text)}
#menuBtn{padding:6px 12px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;white-space:nowrap}
#menuBtn:hover{filter:brightness(1.07)}
#menuList{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:12px}
.mi{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;background:var(--panel2);border:2px solid transparent;font-weight:600;text-align:left}
.mi:hover{border-color:var(--accent)}
.mi.danger{background:#ffe1dc;color:#a3271a}
.mi .e{font-size:20px}
#slots{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.slot{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--panel2)}
.slot .si{flex:1;min-width:0}
.slot .si b{display:block}
.slot .si small{color:var(--muted)}
.slot button{padding:6px 12px;border-radius:9px;background:#fff;border:1.5px solid var(--line);font-weight:600}
.slot button:hover{border-color:var(--accent)}
.slot button:disabled{opacity:.4;cursor:default}
.card h3{margin:18px 0 0;font-size:16px}
#muteBtn{width:32px;height:32px;border-radius:50%;background:var(--panel2);border:1px solid var(--line)}
#shop,#roads{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px}
.deco{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 8px;border-radius:14px;background:var(--panel2);border:2px solid transparent}
.deco:hover{border-color:var(--line)}
.deco.on{border-color:var(--accent);background:#ffd0e4}
.deco .di{font-size:30px;line-height:1.1}
.deco .dn{font-weight:700}
.deco .dp{font-size:12px;color:var(--muted)}
.deco.owned .dp{color:var(--ok);font-weight:600}
.deco canvas{width:100%;height:56px;border-radius:8px;background:linear-gradient(#d9f0ff,#ffe9f4)}
#helpBtn{width:32px;height:32px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);font-weight:700}

#stage{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#hint{position:absolute;left:12px;top:12px;max-width:min(440px,calc(100% - 24px));padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.88);box-shadow:0 2px 10px rgba(180,80,130,.15);font-size:13px;pointer-events:none;backdrop-filter:blur(3px)}
#hint b{color:var(--accent)}
#toast{position:absolute;left:50%;bottom:16px;transform:translate(-50%,20px);padding:9px 16px;border-radius:10px;background:#fff;border:1.5px solid var(--accent);opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}

footer{display:flex;align-items:center;padding:8px 10px;background:var(--panel);border-top:1px solid var(--line)}
#buildBar,#driveBar{display:flex;align-items:center;gap:8px;width:100%;overflow-x:auto;scrollbar-width:thin;padding:2px 2px 6px}
body.sim #buildBar,body:not(.sim) #driveBar{display:none}
#mats,.tiles{display:flex;gap:6px;flex:none}
.sep{width:2px;height:48px;border-radius:2px;background:var(--line);flex:none}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:70px;height:66px;border-radius:18px;background:var(--panel2);border:3px solid transparent;flex:none;transition:transform .12s}
.tile .ic{font-size:29px;line-height:1.05}
.tile .tl{font-size:12.5px;font-weight:700;white-space:nowrap}
.tile .bar{width:38px;height:6px;border-radius:3px;margin-top:1px}
.tile:hover{border-color:var(--line)}
.tile.active{border-color:var(--accent);background:#ffd0e4;transform:translateY(-3px);box-shadow:0 4px 0 #f39ac3}
#delBtn.active{border-color:var(--danger);background:#ffd9d4;box-shadow:0 4px 0 #f0a79c}
.big{display:flex;align-items:center;gap:8px;height:66px;padding:0 26px;border-radius:22px;font-size:22px;font-weight:800;margin-left:auto;flex:none;white-space:nowrap}
.big .ic{font-size:30px}
.go{background:linear-gradient(180deg,#ff86ba,#ff4f9a);color:#fff;box-shadow:0 5px 0 #d63a80}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #d63a80}
.back{background:#fff;color:var(--text);border:3px solid var(--line);box-shadow:0 5px 0 #f1c4da}
.back:active{transform:translateY(3px);box-shadow:0 2px 0 #f1c4da}
.pad{display:flex;flex-direction:column;align-items:center;justify-content:center;width:86px;height:70px;border-radius:22px;flex:none;font-weight:800;font-size:13px;touch-action:none;box-shadow:0 5px 0 rgba(0,0,0,.14)}
.pad .ic{font-size:32px;line-height:1.05}
.pad:active,.pad.on{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.14);filter:brightness(1.08)}
#padBack{background:#bfe6ff}
#padBrake{background:#fff0a8}
#padFast{background:linear-gradient(180deg,#ffc36b,#ff7eb6);color:#fff}
#hornBtn{background:#d9c4ff}
#padFwd{background:linear-gradient(180deg,#b6f2cf,#6fd6a0)}
#padJump{background:#ffd6a8;display:none}
body.trans #padJump{display:flex}
.gt{position:relative}
.gt .dd{position:absolute;right:5px;top:2px;font-size:10px;color:var(--muted)}
#picker{position:absolute;left:10px;right:10px;bottom:10px;z-index:4;max-width:780px;margin:0 auto;background:#fff;border:2px solid var(--line);border-radius:20px;box-shadow:0 10px 30px rgba(120,40,90,.25);padding:10px 12px 12px}
#picker[hidden]{display:none}
#picker .ph{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;margin-bottom:8px}
#picker .ph small{font-weight:500;font-size:12.5px;color:var(--muted)}
#picker .ph button{margin-left:auto;flex:none;width:32px;height:32px;border-radius:50%;background:var(--panel2)}
#picker .pl{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.pc{flex:none;width:148px;padding:8px 10px;border-radius:16px;background:var(--panel2);border:3px solid transparent;text-align:left}
.pc:hover{border-color:var(--line)}
.pc.on{border-color:var(--accent);background:#ffd0e4}
.pc canvas{width:100%;height:30px;display:block;border-radius:8px;background:linear-gradient(#e3f4ff,#fdeaf4)}
.pc .pe{font-size:30px;line-height:30px;text-align:center}
.pc .pn{font-weight:800;font-size:14px;margin:5px 0 3px}
.pc .pm{display:flex;align-items:center;gap:3px;font-size:12px;line-height:17px}
.pc .pm i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ecd9e4}
.pc .pm i.f{background:var(--accent)}
.pc .pd{font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:3px}
#zoomUI{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:8px;z-index:2}
#zoomUI button{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 3px 10px rgba(160,60,120,.22);font-size:22px;display:grid;place-items:center}
#zoomUI button:active{transform:scale(.92)}
#radioBtn{padding:6px 12px;border-radius:12px;background:#d9c4ff;font-weight:700;white-space:nowrap}
#radioBtn.on{background:linear-gradient(90deg,#ff7eb6,#b26bff);color:#fff}
#radio{position:absolute;left:12px;bottom:12px;z-index:3;width:min(280px,calc(100% - 84px));background:#fff;border-radius:18px;border:2px solid var(--line);box-shadow:0 10px 30px rgba(120,40,90,.25);padding:10px 12px 12px}
#radio[hidden]{display:none}
#radio .rh{display:flex;align-items:center;gap:6px;font-weight:800}
#radio .rh .x{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--panel2)}
#radio .st{display:flex;gap:6px;margin:8px 0}
#radio .st button{flex:1;padding:7px 4px;border-radius:12px;background:var(--panel2);font-weight:700;font-size:13px;border:2px solid transparent}
#radio .st button.on{border-color:var(--accent);background:#ffd0e4}
#radio .now{font-size:13px;color:var(--muted);min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#radio .now b{color:var(--text)}
#radio .ctl{display:flex;align-items:center;gap:6px;margin-top:6px}
#radio .ctl button{width:44px;height:40px;border-radius:12px;background:var(--panel2);font-size:18px}
#radio .ctl input{flex:1;accent-color:var(--accent)}
#radio .yt{margin-top:8px;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:16/9}
#radio .yt iframe{width:100%;height:100%;border:0;display:block}
#radio .note{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.35}
#radio.mini .st,#radio.mini .note{display:none}
#radio.mini .yt{width:200px}
#hint{pointer-events:auto;cursor:pointer}
#hint .say{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--panel2);margin-right:4px;vertical-align:middle}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px;margin-left:4px}
.eq i{width:3px;background:var(--accent);border-radius:2px;animation:eq .8s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}

#modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(74,37,69,.38);z-index:5;padding:16px}
#modal[hidden]{display:none}
.card{max-height:100%;overflow:auto;width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 24px;box-shadow:0 20px 60px rgba(120,40,90,.35)}
.card.wide{width:min(780px,100%)}
.kid{display:grid;gap:10px;margin:12px 0}
.kid div{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:14px;background:var(--panel2);font-size:15px;font-weight:600}
.kid b{font-size:30px;line-height:1;flex:none;width:40px;text-align:center}
.card details{margin-top:8px;font-size:13px;color:var(--muted)}
.card summary{cursor:pointer;font-weight:700}
.card h2{margin:0 0 8px;font-size:21px}
.card p{margin:6px 0;color:#6b4263}
.card ul{margin:8px 0;padding-left:18px;color:#6b4263}
.card li{margin:5px 0}
.card .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
.card .stat{background:var(--panel2);border-radius:10px;padding:8px 12px}
.card .stat small{display:block;color:var(--muted);font-size:11px}
.card .stat b{font-size:16px;font-variant-numeric:tabular-nums}
.card .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.card .row button{padding:9px 16px;border-radius:10px;background:var(--panel2);font-weight:650}
.card .row button.primary{background:var(--accent);color:var(--accent-ink)}
#celebrate{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:4;overflow:hidden;animation:milaOut .6s ease-in 3s forwards}
#celebrate[hidden]{display:none}
#celebrate::before{content:"";position:absolute;left:50%;top:50%;width:160vmax;height:160vmax;margin:-80vmax 0 0 -80vmax;
  background:repeating-conic-gradient(rgba(255,226,120,.55) 0 9deg,rgba(255,226,120,0) 9deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 42%);mask:radial-gradient(circle,#000 0,transparent 42%);
  animation:milaSpin 9s linear infinite,milaFade .5s ease-out both}
#celebrate .stack{position:relative;display:flex;flex-direction:column;align-items:center}
#celebrate .crownTop{font-size:clamp(50px,9vw,120px);line-height:1;margin-bottom:-.1em;filter:drop-shadow(0 4px 6px rgba(120,60,0,.35));
  animation:milaIn .8s cubic-bezier(.2,1.6,.4,1) .55s both,milaBob 1.2s ease-in-out 1.4s infinite}
#celebrate .word{display:flex;font:400 clamp(90px,21vw,270px)/1.05 "Titan One","Fredoka","Arial Black",Impact,sans-serif;letter-spacing:.03em}
#celebrate .word span{display:inline-block;color:var(--c);-webkit-text-stroke:.06em #fff;paint-order:stroke fill;
  text-shadow:0 .03em 0 var(--d),0 .06em 0 var(--d),0 .09em 0 var(--d),0 .12em 0 var(--d),0 .17em .08em rgba(80,20,60,.45),0 0 .4em rgba(255,255,255,.95);
  animation:milaIn .9s cubic-bezier(.2,1.6,.4,1) both,milaWob 1.1s ease-in-out infinite;
  animation-delay:calc(var(--i)*.13s),calc(.9s + var(--i)*.13s)}
#celebrate .sub{font:700 clamp(18px,3.4vw,40px)/1 "Fredoka",system-ui,sans-serif;color:#fff;background:linear-gradient(90deg,#ff5fa2,#b26bff);
  padding:.35em 1.1em;border-radius:999px;margin-top:.45em;box-shadow:0 .2em 0 rgba(120,30,90,.35);animation:milaIn .7s cubic-bezier(.2,1.6,.4,1) .8s both}
#celebrate .spk{position:absolute;font-style:normal;animation:spk 1.4s ease-in-out calc(var(--i)*.12s) infinite both}
@keyframes spk{0%{transform:scale(0) rotate(0);opacity:0}40%{transform:scale(1.2) rotate(40deg);opacity:1}100%{transform:scale(0) translateY(-40px) rotate(90deg);opacity:0}}
@keyframes milaBob{50%{transform:translateY(-10%) rotate(6deg)}}
@keyframes milaIn{from{transform:translateY(-130%) scale(.2) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
@keyframes milaWob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-9%) rotate(4deg) scale(1.06)}}
@keyframes milaHue{to{background-position:300% 0}}
@keyframes milaSpin{to{transform:rotate(360deg)}}
@keyframes milaFade{from{opacity:0}}
@keyframes milaOut{to{opacity:0;transform:scale(1.35)}}
@media (max-width:1050px){
  header{gap:8px 10px}
  #levelInfo{display:none}
  .chip{width:28px;height:28px}
  #budget{min-width:180px}
}
@media (max-width:720px){
  #budget{min-width:100%;margin-left:0;order:9}
  header{padding:6px 8px}
  .brand{display:none}
  #levels{flex:1;justify-content:space-between;padding:3px 8px}
  .stop{width:auto;flex:1}
  #muteBtn,#helpBtn{display:none}
  #budgetText{font-size:11px}
  #buildBar{flex-wrap:wrap;row-gap:6px}
  #mats{width:100%;overflow-x:auto;padding-bottom:2px}
  #buildBar .sep{display:none}
  .tiles .tile{width:54px}
  #driveBar{justify-content:space-between}
  #vehBtn,#bank,#menuBtn,#radioBtn{padding:5px 9px;font-size:13px}
  .tile{width:58px;height:58px;border-radius:15px}
  .tile .ic{font-size:24px}
  .tile .tl{font-size:11px}
  .big{height:58px;padding:0 16px;font-size:18px}
  .big .ic{font-size:24px}
  .pad{width:70px;height:62px}
  .pad .ic{font-size:27px}
  #hint{font-size:12px;max-width:calc(100% - 84px)}
  #zoomUI button{width:42px;height:42px;font-size:19px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">🌈 Köprü <span>Ustası</span> 💖</div>
    <div id="levels"></div>
    <div id="levelInfo"><span id="levelName"></span><span id="levelSub"></span></div>
    <button id="vehBtn" title="Araç seç"></button>
    <div id="bank" title="Kumbara: bütçene eklenir, süs dükkânında da harcanabilir">🐷 0 ₺</div>
    <div id="budget">
      <div id="budgetText"><span>Maliyet <b id="costVal">0 ₺</b></span><span id="budgetLbl">Bütçe <b id="budgetVal">0 ₺</b></span></div>
      <div id="bar"><div id="barFill"></div></div>
    </div>
    <button id="radioBtn" title="Radyo: Mila FM">📻 Radyo</button>
    <button id="menuBtn" title="Menü: kaydet, yükle, sıfırdan başla">☰ Menü</button>
    <button id="muteBtn" title="Ses aç/kapat">🔊</button>
    <button id="helpBtn" title="Nasıl oynanır?">?</button>
  </header>

  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="hint"></div>
    <div id="zoomUI"><button id="zIn" title="Yakınlaştır (+)">➕</button><button id="zOut" title="Uzaklaştır (−)">➖</button><button id="zFit" title="Hepsini gör (0)">🏠</button></div>
    <div id="radio" hidden></div>
    <div id="picker" hidden></div>
    <div id="toast"></div>
    <div id="celebrate" hidden></div>
    <div id="modal" hidden><div class="card" id="card"></div></div>
  </main>

  <footer>
    <div id="buildBar">
      <div id="mats"></div>
      <div class="sep"></div>
      <div class="tiles">

function collideWheel(wh, ax, ay, bx, by, na, nb){
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1e-9;
  const t = clamp(((wh.x - ax) * dx + (wh.y - ay) * dy) / l2, 0, 1);
  let nx = wh.x - (ax + dx * t), ny = wh.y - (ay + dy * t);
  const d = Math.hypot(nx, ny);
  if (d >= wh.r || d < 1e-9) return;
  nx /= d; ny /= d;
  const wa = na ? na.w * (1 - t) : 0, wb = nb ? nb.w * t : 0;
  const s = (wh.r - d) / (wh.w + wa * (1 - t) + wb * t);
  wh.x += nx * s * wh.w; wh.y += ny * s * wh.w;
  if (na){ na.x -= nx * s * wa; na.y -= ny * s * wa; }
  if (nb){ nb.x -= nx * s * wb; nb.y -= ny * s * wb; }
  wh.contact = true; wh.nx = nx; wh.ny = ny;
}

function substep(dt){

  const gr = Math.min(1, S.t / 0.8) * G, idt2 = 1 / (dt * dt);

  for (const n of ns){
    if (n.fixed) continue;
    n.vy += gr * dt;
    if (n.y > water){ n.vx *= 0.985; n.vy = n.vy * 0.985 - gr * dt * 0.6; }
    n.px = n.x; n.py = n.y; n.x += n.vx * dt; n.y += n.vy * dt; n.ground = false;
  }
  for (const w of ws){
    w.vy += G * dt;

    w.px = w.x; w.py = w.y; w.x += w.vx * dt; w.y += w.vy * dt; w.contact = false;

    const dl = -C / (wsum + b.alpha * idt2);

    c.x -= c.w * dl * dx; c.y -= c.w * dl * dy;

  }

    r.x += dx * k; r.y += dy * k; f.x -= dx * k; f.y -= dy * k; }

  // tekerlek çarpışmaları
  for (const w of ws){
    for (const r of rects){
      collideWheel(w, Math.max(r.x1, w.x - 50), r.top, Math.min(r.x2, w.x + 50), r.top);
      if (r.x1 > -500) collideWheel(w, r.x1, r.top, r.x1, r.top + 100);
      if (r.x2 < 500) collideWheel(w, r.x2, r.top, r.x2, r.top + 100);
    }
    for (const b of S.beams) if (b.mat.deck) collideWheel(w, b.a.x, b.a.y, b.b.x, b.b.y, b.a, b.b);
  }

    if (n.fixed) continue;

        if (dT <= dL && dT <= dR) n.y = r.top; else if (dL < dR) n.x = r.x1; else n.x = r.x2;

    if (keys.left){ const minX = S.trans && trans ? trans.x0 - 3 : -6; target = ws[0].x > minX ? -S.V.speed * 0.7 : 0; acc = 7; }

    if (w.contact){
      const tx = -w.ny, ty = w.nx, vt = w.vx * tx + w.vy * ty;
      const dv = clamp(target - vt, -acc * dt, acc * dt);
      w.vx += tx * dv; w.vy += ty * dv;
    }
    w.angle += w.vx / w.r * dt;
  }

  // kırılma
  let broke = null;
  for (const b of S.beams){ if (b.stress > S.maxStress) S.maxStress = b.stress; if (b.stress > 1) (broke || (broke = [])).push(b); }
  if (broke) for (const b of broke) breakBeam(b);
}

function breakBeam(b){
  const S = sim; S.beams.splice(S.beams.indexOf(b), 1); S.broken++;
  const a = b.a, c = b.b, mx = (a.x + c.x) / 2, my = (a.y + c.y) / 2;
  const col = b.mat.col || '#ddd';
  SFX.crack();
  for (let i = 0; i < 9; i++) S.particles.push({x:mx, y:my, vx:(Math.random() - .5) * 5, vy:-Math.random() * 4 - 1, life:1, col});
  if (b.rest < 1) return;
  const half = b.rest / 2 * 0.97, mass = b.mat.density * b.rest / 4 + 0.5;
  for (const end of [a, c]){
    const n = {x:mx, y:my, px:mx, py:my, vx:(a.vx + c.vx) / 2, vy:(a.vy + c.vy) / 2, fixed:false, mass, w:1 / mass};
    S.nodes.push(n);
    S.beams.push({a:end, b:n, rest:half, type:b.type, mat:b.mat, alpha:half / b.mat.EA, stress:0, slack:false});
  }
}

/* efektler: su sıçraması, egzoz kalpleri, baloncuklar */
const PASTEL = ['#ff7eb6', '#ffb13d', '#ffe95c', '#8fe3a1', '#7cc8ff', '#c9a7ff'];
function splash(x, p){
  const S = sim, n = Math.round(8 + p * 24);
  for (let i = 0; i < n; i++) S.particles.push({x:x + (Math.random() - .5) * 0.7 * p, y:level.water, vx:(Math.random() - .5) * 5 * p, vy:-(2 + Math.random() * 5.5) * Math.sqrt(p), life:1, col:Math.random() < .5 ? '#f2fbff' : '#a5dcf3'});
  S.rings.push({x, r:0.15, life:1, p}); SFX.splash(p);
}
function puff(x, y, vx, vy, size, col, kind, life, top){ sim.puffs.push({x, y, vx, vy, size, col, kind, life, max:life, top:!!top}); }
function carPoint(lx, ly){
  const [r, f] = sim.car.wheels, a = Math.atan2(f.y - r.y, f.x - r.x), co = Math.cos(a), si = Math.sin(a);
  return [(r.x + f.x) / 2 + lx * co - ly * si, (r.y + f.y) / 2 + lx * si + ly * co];
}

/* kurtarma hikâyesi: prenses paraşütle iner; genç kral babası, kraliçe annesi ve bebek kardeşi sandalla gelip kurtarır; araba batar */
function startRescue(){
  const S = sim, [r, f] = S.car.wheels, cx = (r.x + f.x) / 2, cy = (r.y + f.y) / 2;
  const cuts = [0]; for (const p of [...(level.pillars || [])].sort((a, b) => a.x1 - b.x1)) cuts.push(p.x1, p.x2); cuts.push(level.right);
  let gap = null; for (let i = 0; i < cuts.length; i += 2){ const g = [cuts[i], cuts[i + 1]]; if (!gap || Math.abs((g[0] + g[1]) / 2 - cx) < Math.abs((gap[0] + gap[1]) / 2 - cx)) gap = g; }
  const tx = clamp(cx - 1.0, gap[0] + 1.7, gap[1] - 1.7), bx0 = (tx - gap[0] > gap[1] - tx) ? gap[0] - 2.3 : gap[1] + 2.3;
  S.result = {win:false, rescue:true, msg:'Araba suya battı ama kral babası ile kraliçe annesi sandalla yetişip prensesi kurtardı! Bebek kardeşi de çok sevindi.', at:S.t}; S.drive = false;
  S.rescue = {phase:'eject', t:0, pt:0, x:cx, y:cy - 0.9, vx:0.4, vy:-6.5, tx, bx0, gap, chute:0, boat:null, heartAcc:0, done:false};
  SFX.chute();
}
function updateRescue(dt){
  const S = sim, R = S.rescue, Wt = level.water; R.t += dt; R.pt += dt;
  const b = R.boat;
  if (R.phase === 'eject'){
    R.vy += 9 * dt; R.x += R.vx * dt; R.y += R.vy * dt; if (R.vy > -0.5){ R.phase = 'chute'; R.pt = 0; }
  } else if (R.phase === 'chute'){
    R.chute = Math.min(1, R.chute + dt * 3); R.vy += (1.7 - R.vy) * 3 * dt; R.y += R.vy * dt; R.x += (R.tx - R.x) * 1.1 * dt;
    if (R.y >= Wt - 0.55){ R.y = Wt - 0.55; R.phase = 'float'; R.pt = 0; splash(R.x, 0.55); R.boat = {x:R.bx0, dir:Math.sign(R.x - R.bx0) || 1, k:1}; }
  } else if (R.phase === 'float'){
    R.chute = Math.max(0, R.chute - dt * 2.5); b.x += b.dir * 2.7 * dt;
    if (Math.abs(R.x - b.x) < 1.35){ R.phase = 'board'; R.pt = 0; R.fx = R.x; R.fy = R.y; }
  } else if (R.phase === 'board'){
    const k = Math.min(1, R.pt / 0.7), sx = b.x + b.dir * 0.95, sy = Wt - 0.98;
    R.x = R.fx + (sx - R.fx) * k; R.y = R.fy + (sy - R.fy) * k - Math.sin(k * Math.PI) * 0.9;
    if (k >= 1){ R.phase = 'saved'; R.pt = 0; SFX.saved(); for (let i = 0; i < 14; i++) puff(sx + (Math.random() - .5) * 1.2, sy - 0.3, (Math.random() - .5) * 1.5, -1 - Math.random() * 1.5, 0.1 + Math.random() * 0.1, PASTEL[i % 6], 'heart', 1.6, true); }
  } else if (R.phase === 'saved'){
    R.heartAcc += dt * 5; while (R.heartAcc >= 1){ R.heartAcc--; puff(b.x + (Math.random() - .5), Wt - 1.3, (Math.random() - .5) * 0.6, -0.9, 0.14, PASTEL[Math.random() * 6 | 0], 'heart', 1.3, true); }
    if (R.pt > 3.4){ R.phase = 'leave'; R.pt = 0; }
  } else if (R.phase === 'leave'){
    b.x += b.dir * Math.min(3.2, 0.6 + R.pt * 2.5) * dt; if (b.x > R.gap[1] + 2.4 || b.x < R.gap[0] - 2.4 || R.pt > 9) R.done = true;
  }
  const said = R.said || (R.said = {}), once = (k, c) => { if (c && !said[k]){ said[k] = 1; voice(k, true); } };
  once('mila_chute', R.phase === 'chute');
  once('mila_help', R.phase === 'float');
  once('king_coming', R.phase === 'float' && b && b.x > R.gap[0] + 0.3 && b.x < R.gap[1] - 0.3);
  once('mila_thanks', R.phase === 'saved');
  once('queen_saved', R.phase === 'saved' && R.pt > 1.2);
  once('baby', R.phase === 'saved' && R.pt > 2.4);
  once('king_stronger', R.phase === 'leave');
}

function simStep(){
  const S = sim, dt = FIXED_DT / SUB, water = level.water, V = S.V;
  for (let i = 0; i < SUB; i++) substep(dt);
  S.t += FIXED_DT;
  for (const p of S.particles){ p.vy += G * FIXED_DT; p.x += p.vx * FIXED_DT; p.y += p.vy * FIXED_DT; p.life -= FIXED_DT * 1.2; }
  S.particles = S.particles.filter(p => p.life > 0);

  const [r, f] = S.car.wheels;
  if (r.contact || f.contact) S.lastGround = S.t;
  if (fwdHeld()) S.started = true;
  // suya düşenler sıçratır
  for (const n of S.nodes) if (!n.wet && !n.fixed && n.y > water){ n.wet = true; if (S.splashN++ < 40) splash(n.x, 0.3); }
  for (const w of [r, f]) if (!w.wet && w.y > water){ w.wet = true; splash(w.x, 1); }
  // egzozdan renkli kalpler (hızlandıkça daha çok)
  if (S.drive && !S.rescue && (r.contact || f.contact)){
    const sp = Math.hypot(r.vx, r.vy), a = Math.atan2(f.y - r.y, f.x - r.x);
    S.puffAcc += (2.5 + sp * 1.6 + (isFast() ? 18 : 0)) * FIXED_DT;
    while (S.puffAcc >= 1){
      S.puffAcc--; const [ex, ey] = carPoint(V.ex, -0.28), k = 0.8 + Math.random() * 1.2;
      puff(ex, ey, -Math.cos(a) * k + r.vx * 0.25, -Math.sin(a) * k - 0.5 - Math.random() * 0.7, (isFast() ? 0.15 : 0.1) + Math.random() * 0.09, PASTEL[Math.random() * 6 | 0], 'heart', 1.1 + Math.random() * 0.5);
    }
    if (store.equipped.sparkle){
      S.sparkAcc += (3 + sp * 3) * FIXED_DT;
      while (S.sparkAcc >= 1){ S.sparkAcc--; const [sx, sy] = carPoint(V.ex + 0.3, -0.1 - Math.random() * 0.9); puff(sx, sy, r.vx * 0.1, 0.2, 0.07 + Math.random() * 0.08, Math.random() < .5 ? '#fff6c9' : '#ffffff', 'star', 0.9); }
    }
  }
  // batan arabadan baloncuklar
  if ((r.y > water || f.y > water) && S.bubT < 7){
    S.bubT += FIXED_DT; S.bubAcc += 14 * FIXED_DT;
    while (S.bubAcc >= 1){ S.bubAcc--; puff((r.x + f.x) / 2 + (Math.random() - .5) * V.wb, (r.y + f.y) / 2 - 0.3, (Math.random() - .5) * 0.4, -1 - Math.random() * 1.2, 0.04 + Math.random() * 0.09, '#fff', 'bubble', 4, true); }
  }
  for (const p of S.puffs){
    p.x += p.vx * FIXED_DT; p.y += p.vy * FIXED_DT; p.vx *= 0.97; p.life -= FIXED_DT;
    if (p.kind === 'heart') p.vy -= 0.5 * FIXED_DT; else if (p.kind === 'bubble'){ p.vx += (Math.random() - .5) * 0.3; if (p.y < water + 0.05) p.life = 0; }
  }
  S.puffs = S.puffs.filter(p => p.life > 0);
  for (const g of S.rings){ g.r += (1.2 + g.p * 1.6) * FIXED_DT; g.life -= FIXED_DT * 0.9; }
  S.rings = S.rings.filter(g => g.life > 0);
  if (S.rescue) updateRescue(FIXED_DT);

  if (S.trans && trans){   // köprüler arasındaki yol: kamera arabayı izler, sonunda yeni bölüme oturur
    const T = trans, p = clamp((f.x - T.x0) / (T.x1 - T.x0), 0, 1), e = p * p * (3 - 2 * p), Lr = (a, b) => a + (b - a) * e, sm = k => k * k * (3 - 2 * k);
    const sc = Lr(T.from.s, T.to.s), follow = f.x + W * 0.2 / sc;
    let cx = T.from.cx + (follow - T.from.cx) * sm(clamp(p / 0.15, 0, 1)); cx += (T.to.cx - cx) * sm(clamp((p - 0.8) / 0.2, 0, 1));
    view.s = sc; view.ox = W / 2 - cx * sc; view.oy = H / 2 - Lr(T.from.cy, T.to.cy) * sc; T.bgW = Lr(T.from.w, T.to.w);
    roadStep(FIXED_DT);
    if (f.x >= T.x1){
      const ni = T.ni, bonus = T.bonus; trans = null; store.bonus = (store.bonus || 0) + bonus; saveStore(); setLevel(ni);
      if (bonus) toast(`🐷 Yol bonusu: +${fmt(bonus)} kumbaraya!`); return;
    }
    updateHint(); return;
  }
  if (!S.result){
    if (!fwdHeld() || Math.abs(f.x - S.lastX) > 0.4){ S.lastX = f.x; S.lastMoveT = S.t; }   // yalnızca ileri basarken ilerleyemezse takıldı sayılır
    const falling = !r.contact && !f.contact && (r.y + f.y) / 2 - V.r > Math.max(0, level.rightTop) + 1.7 && r.vy > 1;
    if (r.y > water || f.y > water || falling) startRescue();
    else if (r.x > level.right + 4) finish(true);
    else if (S.t - S.lastMoveT > 6) finish(false, 'Araç takıldı, karşıya ulaşamadı.');
  } else if (!S.shown && (S.result.rescue ? S.rescue.done : S.t - S.result.at > (S.result.win ? 3.4 : 0.9))){ S.shown = true; showResult(); }
  updateHint();
}

/* kazanma kutlaması: dev "Mila" yazısı + konfeti */
const WIN_WORD = 'MİLA';
let confetti = [];
function celebrate(){
  const el = $('#celebrate');
  const lc = [['#ff4f9a', '#c2185b'], ['#ffb300', '#c77800'], ['#2fcf8f', '#158a5a'], ['#4da6ff', '#1f6fc2'], ['#b26bff', '#7a35c9']];

  const cols = ['#ff5e7e', '#ffb13d', '#ffe95c', '#5be38f', '#4db8ff', '#b57bff', '#ffffff'];

  for (let i = 0; i < 90; i++){
    const a = Math.random() * 0.9 + 0.35, v = 500 + Math.random() * 650;
    mk(0, H, Math.cos(a) * v, -Math.sin(a) * v); mk(W, H, -Math.cos(a) * v, -Math.sin(a) * v);
  }
  for (let i = 0; i < 80; i++) mk(Math.random() * W, -20 - Math.random() * H * 0.8, (Math.random() - .5) * 80, 60 + Math.random() * 120);
  launchFireworks(6, 2.8);
}
function stopCelebrate(){ clearTimeout(celebrate.h); $('#celebrate').hidden = true; confetti = []; fireworks = []; fwQueue = []; }
let fireworks = [], fwQueue = [];
function launchFireworks(n, span){ const now = performance.now(); for (let i = 0; i < n; i++) fwQueue.push(now + Math.random() * span * 1000); }
function drawFireworks(d){
  const now = performance.now();
  fwQueue = fwQueue.filter(tm => {
    if (tm > now) return true;
    const x = W * (0.12 + Math.random() * 0.76), y = H * (0.1 + Math.random() * 0.35), col = PASTEL[Math.random() * 6 | 0], n = 34;
    for (let i = 0; i < n; i++){ const a = i / n * 6.283, v = 110 + Math.random() * 150; fireworks.push({x, y, vx:Math.cos(a) * v, vy:Math.sin(a) * v, life:1.2, col:i % 3 ? col : '#ffffff'}); }
    SFX.pop(); return false;
  });
  if (!fireworks.length) return;
  screenT();
  for (const p of fireworks){
    p.vx *= 1 - 1.6 * d; p.vy = p.vy * (1 - 1.6 * d) + 90 * d; p.x += p.vx * d; p.y += p.vy * d; p.life -= d;
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.4)); ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, 2.4, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1; fireworks = fireworks.filter(p => p.life > 0);
}
function drawConfetti(d){
  if (!confetti.length) return;
  screenT();
  for (const p of confetti){
    p.vy += 620 * d; p.vx *= 1 - 1.2 * d; p.vy *= 1 - 1.2 * d; p.x += p.vx * d; p.y += p.vy * d; p.rot += p.vr * d; p.life -= d;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.cos(p.rot * 1.7));
    ctx.globalAlpha = Math.min(1, p.life); ctx.fillStyle = p.col; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
  }
  ctx.globalAlpha = 1;
  confetti = confetti.filter(p => p.life > 0 && p.y < H + 40);
}

function finish(win, msg){
  const S = sim; S.result = {win, msg, at:S.t}; S.drive = false;
  if (win){ celebrate(); SFX.win(); setTimeout(() => { if (sim && sim.result && sim.result.win) voice('win'); }, 650); }
  if (win){
    const prev = store.done[levelIndex]; if (prev == null || S.cost < prev) store.done[levelIndex] = S.cost;
    const pz = prize(S.kind, levelIndex), old = store.earn[levelIndex] || 0;
    S.result.gain = Math.max(0, pz - old); S.result.old = old;
    if (pz > old) store.earn[levelIndex] = pz;
    saveStore(); updateUI();
  }
}

function roadStep(dt){
  const T = trans, S = sim, [r, f] = S.car.wheels, cx = (r.x + f.x) / 2;
  T.spawnT -= dt;   // gökten bonus yağar
  if (T.spawnT <= 0){
    T.spawnT = 0.7 + Math.random() * 0.9;
    const x = cx + 3 + Math.random() * 11;
    if (x < T.x1 - 2){ const q = Math.random(), it = q < .55 ? ['🪙', 50] : q < .8 ? ['⭐', 100] : q < .93 ? ['🎁', 150] : ['💎', 250];
      T.items.push({x, y:T.gy - 9 - Math.random() * 2, vy:1.6 + Math.random() * 1.2, e:it[0], v:it[1], life:4, ph:Math.random() * 6, landed:false}); }
  }
  const [bx, by] = carPoint(0, -0.8);
  for (const it of T.items){
    if (!it.landed){ it.y += it.vy * dt; it.x += Math.sin(S.t * 2 + it.ph) * 0.3 * dt; if (it.y >= T.gy - 0.4){ it.y = T.gy - 0.4; it.landed = true; } }
    else it.life -= dt;
    if (Math.hypot(it.x - bx, it.y - by) < 1.3){
      it.got = true; T.bonus += it.v; SFX.coin(); T.floats.push({x:it.x, y:it.y - 0.5, text:'+' + it.v, life:1});
      for (let i = 0; i < 8; i++) puff(it.x, it.y, (Math.random() - .5) * 3, -1 - Math.random() * 2, 0.09, '#ffe27a', 'star', 0.8, true);
    }
  }
  T.items = T.items.filter(it => !it.got && it.life > 0);
  for (const fl of T.floats){ fl.y -= dt * 0.8; fl.life -= dt; }
  T.floats = T.floats.filter(fl => fl.life > 0);
  for (const o of T.obs){   // engele çarpan araba geri seker: ⬆ ile üstünden zıpla
    if (S.t - o.hitT < 0.8) continue;
    for (const w of [f, r]) if (w.x < o.x && o.x - w.x < o.w / 2 + w.r * 0.7 && w.y + w.r > T.gy - o.h + 0.08){   // yalnızca soldan gelen tekerlek çarpar
      o.hitT = S.t; SFX.bump();

function jump(){

function drawRoadStuff(t){
  const T = trans;
  for (const [type, x] of T.deco){ ctx.save(); ctx.translate(x, T.gy); SCN[type](ctx, t); ctx.restore(); }
  screenT(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const k = view.s, sx = x => x * k + view.ox, sy = y => y * k + view.oy;
  for (const o of T.obs){
    const hit = sim.t - o.hitT < 0.4; ctx.font = `${o.h * k * 1.4}px ${EMOF}`;
    ctx.fillText(o.e, sx(o.x) + (hit ? Math.sin(t * 60) * 3 : 0), sy(T.gy - o.h * 0.5));
  }
  for (const it of T.items){
    if (it.landed && it.life < 1.2 && Math.sin(t * 20) > 0) continue;
    ctx.save(); ctx.translate(sx(it.x), sy(it.y)); ctx.rotate(Math.sin(t * 3 + it.ph) * 0.2); ctx.font = `${0.85 * k}px ${EMOF}`; ctx.fillText(it.e, 0, 0); ctx.restore();
  }
  ctx.font = `800 ${Math.max(15, 0.55 * k)}px Fredoka, system-ui, sans-serif`; ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.fillStyle = '#ff4f9a';
  for (const fl of T.floats){ ctx.globalAlpha = Math.min(1, fl.life * 1.5); ctx.strokeText(fl.text, sx(fl.x), sy(fl.y)); ctx.fillText(fl.text, sx(fl.x), sy(fl.y)); }
  ctx.globalAlpha = 1; worldT();
}

// --- basit sıralayıcı (16'lık notalar, 4 ölçü döngü)
function synthNote(t, f, dur, type, vol, dest, cut){
  const a = actx, o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.value = f;
  let out = o; if (cut){ const fl = a.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = cut; o.connect(fl); out = fl; }
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  out.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.05);
}
let noiseBuf = null;
function synthNoise(t, dur, vol, type, freq, dest){
  const a = actx; if (!noiseBuf){ noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const src = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain(); src.buffer = noiseBuf; fl.type = type; fl.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); src.connect(fl); fl.connect(g); g.connect(dest); src.start(t); src.stop(t + dur + 0.02);
}
function kick(t, dest){ const a = actx, o = a.createOscillator(), g = a.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.18);
  g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.28); o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.3); }
function parseMel(str){
  const tk = str.trim().split(/\s+/), out = [];
  tk.forEach((x, i) => { if (x === '.' || x === '-') return; let n = 1; while (tk[i + n] === '-') n++; out[i] = [midi(x), n]; });
  return {notes:out, len:tk.length};
}
TUNES.forEach(T => { T.m = parseMel(T.mel); });
function scheduleStep(T, i, t){
  const dest = radio.gain, st = 60 / T.bpm / 4, s = i % 16, bar = Math.floor(i / 16) % T.prog.length, ch = T.prog[bar], L = radio.loops;
  if (L % 4 !== 3 || s < 8){ if (s % 4 === 0) kick(t, dest); }
  if (s === 4 || s === 12) synthNoise(t, 0.16, 0.35, 'bandpass', 1900, dest);
  if (s % 2 === 1) synthNoise(t, 0.035, s % 4 === 3 ? 0.14 : 0.08, 'highpass', 8000, dest);
  if ([0, 2, 3, 6, 8, 10, 11, 14].includes(s)){ const up = s === 3 || s === 11 ? 12 : 0; synthNote(t, hz(BASS[ch] + up), st * 1.6, 'sawtooth', 0.22, dest, 700); }
  if (s === 2 || s === 6 || s === 10 || s === 14) for (const m of CHORD[ch]) synthNote(t, hz(m), st * 1.4, 'triangle', 0.07, dest);
  if (L > 0){ const nt = T.m.notes[i % T.m.len]; if (nt){ synthNote(t, hz(nt[0]), st * nt[1] * 0.95, 'square', 0.055, dest, 3200); synthNote(t, hz(nt[0] + 12), st * nt[1] * 0.6, 'sine', 0.035, dest); } }
  else if (s % 2 === 0) synthNote(t, hz(CHORD[ch][(s / 2) % 3] + 24), st * 1.2, 'sine', 0.04, dest);
}
function popTick(){
  const T = TUNES[radio.song], st = 60 / T.bpm / 4, a = actx;

}

/* -------------------------------------------------------------- girdi */
function toWorld(e){ const r = cv.getBoundingClientRect(); return {x:(e.clientX - r.left - view.ox) / view.s, y:(e.clientY - r.top - view.oy) / view.s}; }

cv.addEventListener('contextmenu', e => e.preventDefault());
let boost = false;
const ptrs = new Map(); let pinch = null, pan = null;
const pinchInfo = () => { const [a, b] = [...ptrs.values()], r = cv.getBoundingClientRect(); return {d:Math.hypot(a.x - b.x, a.y - b.y) || 1, mx:(a.x + b.x) / 2 - r.left, my:(a.y + b.y) / 2 - r.top}; };
cv.addEventListener('wheel', e => {
  e.preventDefault(); const r = cv.getBoundingClientRect();
  if (e.ctrlKey || Math.abs(e.deltaY) >= Math.abs(e.deltaX)) zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-clamp(e.deltaY, -120, 120) * (e.ctrlKey ? 0.01 : 0.0022)));
  else panBy(-e.deltaX, 0);
}, {passive:false});
cv.addEventListener('pointerdown', e => {
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size === 2){   // ikinci parmak: çizimi bırak, yakınlaştırmaya geç
    if (drag && !drag.sticky) drag = null;
    padFwd = false; pan = null; pinch = pinchInfo(); try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    return;
  }
  if (ptrs.size > 2) return;
  if (mode === 'sim'){ if (e.button === 0){ padFwd = true; try { cv.setPointerCapture(e.pointerId); } catch (_) {} } return; }
  if (mode !== 'build') return;
  const p = toWorld(e); mouse.x = p.x; mouse.y = p.y; mouse.inside = true;
  if (e.button === 2){ if (drag) drag = null; else deleteAt(p); return; }
  if (e.button !== 0) return;
  if (pickerG) closePicker();
  if (tool === 'delete'){ deleteAt(p); return; }
  if (STRUCT[tool]){ addStruct(structPlan(tool, p)); return; }
  if (drag && drag.sticky){
    const t = dragTarget(drag.from, p, tool), to = commitBeam(drag.from, t, tool);
    drag = to ? {from:to, sticky:true, target:null} : null;
    return;
  }
  const n = nodeAt(p);
  if (!n){ pan = {x:e.clientX, y:e.clientY, sx:e.clientX, sy:e.clientY, moved:false, p}; try { cv.setPointerCapture(e.pointerId); } catch (_) {} return; }
  if (n){ drag = {from:n, sticky:false, moved:false, sx:e.clientX, sy:e.clientY, target:null}; try { cv.setPointerCapture(e.pointerId); } catch (_) {} }
});
cv.addEventListener('pointermove', e => {
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pinch && ptrs.size >= 2){
    const q = pinchInfo(); panBy(q.mx - pinch.mx, q.my - pinch.my); zoomAt(q.mx, q.my, q.d / pinch.d); pinch = q; return;
  }
  if (pan){
    if (!pan.moved && Math.hypot(e.clientX - pan.sx, e.clientY - pan.sy) > 6) pan.moved = true;
    if (pan.moved){ panBy(e.clientX - pan.x, e.clientY - pan.y); pan.x = e.clientX; pan.y = e.clientY; }
    return;
  }
  const p = toWorld(e); mouse.x = p.x; mouse.y = p.y; mouse.inside = true;
  if (mode !== 'build') return;
  if (drag){
    if (!drag.sticky && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 6) drag.moved = true;
    drag.target = dragTarget(drag.from, p, tool);
  }
  hoverNode = nodeAt(p); hoverBeam = hoverNode ? null : beamAt(p);
});
cv.addEventListener('pointercancel', e => { padFwd = false; ptrs.delete(e.pointerId); pinch = null; pan = null; });
cv.addEventListener('pointerup', e => {
  ptrs.delete(e.pointerId);
  if (pinch){ if (ptrs.size < 2) pinch = null; padFwd = false; return; }
  if (pan){   // kaydırma değil de dokunuşsa: arabaya dokunmak korna çalar
    const q = pan.p, V = VEHICLES[store.vehicle], moved = pan.moved; pan = null;
    if (!moved && q.y < 0.1 && q.y > -2.4 && q.x > -2.5 - V.wb - 1 && q.x < -1.5) horn();
    return;
  }
  padFwd = false;
  if (mode !== 'build' || !drag || drag.sticky || e.button !== 0) return;
  const t = dragTarget(drag.from, toWorld(e), tool);
  if (drag.moved && t.ok){ commitBeam(drag.from, t, tool); drag = null; }
  else if (!drag.moved){ drag.sticky = true; drag.target = null; }
  else drag = null;
});
cv.addEventListener('pointerleave', () => { mouse.inside = false; hoverNode = hoverBeam = null; });

// sürüş: → ileri, Ctrl+→ hızlı, ← geri, ↓ fren, ↑ zıpla (yalnızca köprüler arası yolda), Shift korna
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowRight'){ keys.right = false; keys.fast = false; }
  else if (e.key === 'ArrowLeft') keys.left = false;
  else if (e.key === 'ArrowDown') keys.down = false;
  else if (e.key === 'Control') keys.fast = false;
  else if (e.key === 'Shift') hornStop();
});
window.addEventListener('blur', () => { boost = false; padFwd = false; keys.right = keys.left = keys.down = keys.fast = false; hornStop(); });
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft' || e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    if (mode === 'sim'){
      e.preventDefault();
      if (e.key === 'ArrowRight'){ keys.right = true; if (e.ctrlKey) keys.fast = true; }
      else if (e.key === 'ArrowLeft') keys.left = true;
      else if (e.key === 'ArrowDown') keys.down = true;
      else jump();
    }
    return;
  }
  if (e.key === 'Control'){ if (keys.right) keys.fast = true; return; }
  if (e.key === 'Shift'){ if (!e.repeat && $('#modal').hidden) hornStart(); return; }
  if ((e.key === 'k' || e.key === 'K' || e.key === 'h' || e.key === 'H') && $('#modal').hidden){ horn(); return; }
  if ((e.key === '+' || e.key === '=') && $('#modal').hidden){ zoomAt(W / 2, H / 2, 1.25); return; }
  if ((e.key === '-' || e.key === '_') && $('#modal').hidden){ zoomAt(W / 2, H / 2, 0.8); return; }
  if (e.key === '0' && $('#modal').hidden){ resetCam(); computeView(); return; }
  if (e.key === 'Escape'){ if (!$('#modal').hidden && mode === 'build') closeModal(); drag = null; return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){ e.preventDefault(); undo(); return; }
  if (e.code === 'Space'){ e.preventDefault(); if (e.repeat) return; if (trans) jump(); else if (mode === 'sim') stopSim(); else if ($('#modal').hidden) startSim(); return; }   // yolda Boşluk da zıplatır
  if (mode !== 'build') return;
  const gi = ['1', '2', '3', '4'].indexOf(e.key); if (gi >= 0) groupTap(Object.keys(GROUPS)[gi]);
  if (e.key.toLowerCase() === 'x' || e.key === 'Delete'){ tool = tool === 'delete' ? store.lastTool.yol : 'delete'; drag = null; updateUI(); }
});

/* -------------------------------------------------------------- çizim */
function viewFor(L){
  const tall = H > W * 1.05, xmin = tall ? -5.2 : -8.5, xmax = L.right + (tall ? Math.min(5.5, L.padRight || 5.5) : (L.padRight || 8));

const cam = {z:1, cx:null, cy:null};

function computeView(){
  if (!level || !W) return;

  const x0 = -b.ox / b.s, x1 = (W - b.ox) / b.s, y0 = -b.oy / b.s, y1 = (H - b.oy) / b.s;

function drawTerrain(t){

function drawRescue(t){

function renderTransition(t){   // iki bölüm yan yana; kamera arabayla birlikte sağa kayar

  const keep = [level, rects, structs]; level = T.B.level; rects = T.B.rects; structs = T.B.structs; sceneDX = T.dx; sceneDY = T.dy;
  ctx.save(); ctx.translate(T.dx, T.dy); ctx.beginPath(); ctx.rect(seam - T.dx, -1e4, 1e4, 2e4); ctx.clip();
  drawTerrain(t); drawAnchorBlocks(); drawBridge(T.B.beams, T.B.nodes, false); drawWater(t); ctx.restore();

    drawParked(t);
    for (const b of beams) if (!MAT[b.type].deck) drawBeam(b.a.x, b.a.y, b.b.x, b.b.y, b.type, 0);
    beams.forEach((b, i) => { if (MAT[b.type].deck) drawBeam(b.a.x, b.a.y, b.b.x, b.b.y, b.type, 0, i); });
    if (hoverBeam && !drag && (tool === 'delete')){ ctx.lineCap = 'round'; strokeSeg(hoverBeam.a.x, hoverBeam.a.y, hoverBeam.b.x, hoverBeam.b.y, 'rgba(255,80,60,.75)', 0.4); }
    let label = null;
    if (STRUCT[tool] && mouse.inside && !pan && !pinch){
      const pl = structPlan(tool, mouse); drawStructGhost(pl);
      label = {x:pl.x, y:pl.y - 0.6, text:pl.ok ? `${STRUCT[tool].ic} ${STRUCT[tool].name} · ${fmt(STRUCT[tool].cost)}` : 'buraya olmaz'};
    }
    if (drag){
      const f = drag.from, m = MAT[tool] || MAT.road;
      ctx.beginPath(); ctx.arc(f.x, f.y, m.maxLen, 0, 7); ctx.fillStyle = 'rgba(255,210,94,.07)'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,210,94,.55)'; ctx.lineWidth = 0.04; ctx.setLineDash([0.25, 0.25]); ctx.stroke(); ctx.setLineDash([]);
      const tg = drag.target;
      if (tg && !(tg.x === f.x && tg.y === f.y)){
        ctx.globalAlpha = tg.ok ? 0.75 : 0.35; drawBeam(f.x, f.y, tg.x, tg.y, tool, tg.ok ? 0 : 1); ctx.globalAlpha = 1;
        if (!tg.node){ ctx.beginPath(); ctx.arc(tg.x, tg.y, 0.14, 0, 7); ctx.fillStyle = tg.ok ? '#fff' : '#ff5a45'; ctx.fill(); }
        const len = Math.hypot(tg.x - f.x, tg.y - f.y);
        label = {x:(f.x + tg.x) / 2, y:(f.y + tg.y) / 2, text:tg.ok ? `${len.toFixed(1)} m · ${fmt(len * m.cost)}` : 'buraya olmaz'};
      }
    }
    for (const n of nodes) drawNode(n, n === hoverNode || (drag && (n === drag.from || (drag.target && drag.target.node === n))));
    if (label){
      screenT(); ctx.font = '600 12px system-ui,sans-serif';
      const x = label.x * view.s + view.ox, y = label.y * view.s + view.oy - 16, w = ctx.measureText(label.text).width + 14;
      ctx.fillStyle = 'rgba(12,21,29,.88)'; rr(x - w / 2, y - 11, w, 22, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label.text, x, y + 1);
    }
    drawSpeech();
  }
}

/* -------------------------------------------------------------- döngü */
let last = performance.now(), acc = 0;
function frame(now){
  const d = Math.min(0.05, (now - last) / 1000); last = now;
  if (mode === 'sim' && sim){ acc += d; let k = 0; while (sim && acc >= FIXED_DT && k < 3){ simStep(); acc -= FIXED_DT; k++; } if (k === 3) acc = 0; }
  if (mode === 'sim') followCam(d);
  if (hornNode) hornT = now / 1000;
  render(now / 1000);
  drawConfetti(d); drawFireworks(d);
  requestAnimationFrame(frame);
}

buildUI();
new ResizeObserver(resize).observe($('#stage'));
resize();
setLevel(unlocked(store.level || 0) ? store.level || 0 : 0, true);
if (!store.storySeen[levelIndex]) showStory(levelIndex, () => { if (!store.seenHelp) showHelp(); });
else if (!store.seenHelp) showHelp();
requestAnimationFrame(frame);

// Konsoldan deneme / hata ayıklama için küçük bir API
window.__kopru = {
  add(x1, y1, x2, y2, type = 'wood'){
    const get = (x, y) => nodes.find(n => n.x === x && n.y === y) || (nodes.push({x, y, fixed:false}), nodes[nodes.length - 1]);
    const a = get(x1, y1), b = get(x2, y2); if (!beams.some(q => (q.a === a && q.b === b) || (q.a === b && q.b === a))) beams.push({a, b, type}); persist();
  },
  clear(){ beams = []; cleanupOrphans(); persist(); },
  testMode(){ TEST_MODE = true; STORE_KEY = 'kopru-ustasi-test'; store = freshStore(); store.seenHelp = true; closeModal(); setLevel(0, true); },
  struct(t, x, y){ addStruct(structPlan(t, {x, y})); }, get structs(){ return structs; }, jump, selectTool, openPicker,
  menu:showMenu, start:startSim, stop:stopSim, setLevel:i => setLevel(i, true), next:goNext, horn, keys, get trans(){ return trans; }, get view(){ return view; }, step(n = 1){ for (let i = 0; i < n && sim; i++) simStep(); },
  get sim(){ return sim; }, get cost(){ return totalCost(); }, MAT, VEHICLES, LEVELS,
};
})();
